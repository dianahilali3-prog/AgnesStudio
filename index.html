<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0612">
<title>Studio — Création IA</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
--bg:#0a0612;--bg2:#12091e;--panel:#180d28;--panel2:#1f1235;--panel3:#281843;
--border:#2d1b4a;--border2:#3d2461;
--ink:#f0e8ff;--ink2:#b8a4d8;--ink3:#7a6596;--ink4:#4d3d63;
--rose:#ff4d9d;--rose2:#ff7bb8;--rose3:#ffb3d9;
--fuchsia:#d946ef;--violet:#8b5cf6;--violet2:#a78bfa;
--success:#10b981;--error:#ef4444;--warn:#f59e0b;--info:#3b82f6;
--grad-main:linear-gradient(135deg,#ff4d9d 0%,#d946ef 50%,#8b5cf6 100%);
--grad-panel:linear-gradient(180deg,rgba(24,13,40,.95),rgba(18,9,30,.85));
--radius:16px;
--shadow:0 8px 32px rgba(255,77,157,.15);
--font:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',Arial,sans-serif;
--mono:ui-monospace,'SF Mono',Menlo,monospace;
}
html,body{overscroll-behavior:none;background:var(--bg)}
body{font-family:var(--font);background:var(--bg);color:var(--ink);min-height:100vh;font-size:15px;line-height:1.5;
background-image:radial-gradient(ellipse at 0% 0%,rgba(255,77,157,.12),transparent 50%),radial-gradient(ellipse at 100% 0%,rgba(217,70,239,.10),transparent 50%),radial-gradient(ellipse at 50% 100%,rgba(139,92,246,.08),transparent 50%);
background-attachment:fixed;
padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
padding-top:calc(env(safe-area-inset-top) + 8px);
overflow-x:hidden}
.app{max-width:640px;margin:0 auto;padding:0 16px 140px;position:relative}
.app-header{display:flex;align-items:center;gap:12px;padding:12px 0 20px;position:sticky;top:0;background:linear-gradient(180deg,rgba(10,6,18,.98),rgba(10,6,18,.85));backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);z-index:50;border-bottom:1px solid transparent;margin:0 -16px;padding-left:16px;padding-right:16px}
.app-header.scrolled{border-bottom-color:var(--border)}
.logo{width:44px;height:44px;border-radius:12px;background:var(--grad-main);display:grid;place-items:center;font-size:20px;box-shadow:var(--shadow);flex-shrink:0}
.app-title{font-size:16px;font-weight:700;letter-spacing:-.02em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.app-title small{display:block;font-size:11px;color:var(--ink2);font-weight:500}
.header-actions{display:flex;gap:6px}
.icon-btn{width:36px;height:36px;border-radius:10px;background:var(--panel2);border:1px solid var(--border);color:var(--ink2);display:grid;place-items:center;font-size:15px;cursor:pointer;transition:all .15s;font-family:inherit}
.icon-btn:active{transform:scale(.92);background:var(--panel3)}
.tabs-scroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin:0 -16px;padding:0 16px 12px}
.tabs-scroll::-webkit-scrollbar{display:none}
.tabs{display:flex;gap:8px;min-width:max-content}
.tab{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:14px;background:var(--panel);border:1px solid var(--border);color:var(--ink2);font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap;font-family:inherit}
.tab.active{background:var(--grad-main);color:#fff;border-color:transparent;box-shadow:var(--shadow)}
.tab-dot{width:6px;height:6px;border-radius:50%;background:var(--success);flex-shrink:0}
.tab.tab-new{padding:10px 14px;background:transparent;border-style:dashed;color:var(--ink3)}
.card{background:var(--grad-panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,77,157,.3),transparent)}
.card-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card-title .badge{font-size:10px;padding:2px 8px;border-radius:999px;background:rgba(255,77,157,.15);color:var(--rose2);border:1px solid rgba(255,77,157,.3);font-weight:700}
.card-title .badge.off{background:rgba(122,101,150,.15);color:var(--ink3);border-color:var(--border)}
.card-title .badge.on{background:rgba(16,185,129,.15);color:var(--success);border-color:rgba(16,185,129,.3)}
.field{margin-bottom:12px}
.field:last-child{margin-bottom:0}
.field label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:var(--bg2);color:var(--ink);font-family:inherit;font-size:14px;outline:none;transition:border-color .15s;-webkit-appearance:none;appearance:none}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--rose);box-shadow:0 0 0 3px rgba(255,77,157,.12)}
.field textarea{resize:vertical;min-height:80px;line-height:1.5}
.field select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='%23b8a4d8' d='M0 0l5 6 5-6z'/></svg>");background-repeat:no-repeat;background-position:right 14px center;padding-right:36px}
.btn{width:100%;padding:14px 20px;border-radius:14px;border:none;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:8px;-webkit-appearance:none}
.btn-primary{background:var(--grad-main);color:#fff;box-shadow:var(--shadow)}
.btn-primary:active:not(:disabled){transform:scale(.97)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn-secondary{background:var(--panel2);border:1px solid var(--border);color:var(--ink)}
.btn-secondary:active{background:var(--panel3);transform:scale(.97)}
.btn-danger{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);color:#fca5a5}
.btn-sm{padding:8px 14px;font-size:13px;width:auto;border-radius:10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.section{margin-bottom:20px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:0 4px}
.section-title{font-size:16px;font-weight:700;letter-spacing:-.01em;color:var(--ink);display:flex;align-items:center;gap:8px}
.section-title .count{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--panel2);color:var(--ink3);font-weight:600}
.section-action{font-size:13px;color:var(--rose2);font-weight:600;cursor:pointer;background:none;border:none;font-family:inherit}
.empty{text-align:center;padding:40px 20px;color:var(--ink3)}
.empty .icon{font-size:44px;margin-bottom:12px;opacity:.6}
.empty .text{font-size:14px;line-height:1.5}
.toast{position:fixed;top:calc(env(safe-area-inset-top) + 16px);left:50%;transform:translateX(-50%) translateY(-200px);background:var(--panel3);border:1px solid var(--border2);border-radius:14px;padding:12px 18px;font-size:14px;font-weight:600;color:var(--ink);z-index:1000;opacity:0;transition:all .35s cubic-bezier(.2,.9,.3,1.2);max-width:calc(100vw - 32px);display:flex;align-items:center;gap:10px;box-shadow:0 8px 32px rgba(0,0,0,.5);pointer-events:none}
.toast.visible{transform:translateX(-50%) translateY(0);opacity:1}
.toast.success{border-color:rgba(16,185,129,.5);background:linear-gradient(180deg,rgba(16,185,129,.15),var(--panel3))}
.toast.error{border-color:rgba(239,68,68,.5);background:linear-gradient(180deg,rgba(239,68,68,.15),var(--panel3))}
.toast.warn{border-color:rgba(245,158,11,.5);background:linear-gradient(180deg,rgba(245,158,11,.15),var(--panel3))}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:200;opacity:0;pointer-events:none;transition:opacity .25s}
.modal-backdrop.visible{opacity:1;pointer-events:auto}
.modal{position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-radius:24px 24px 0 0;padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom));z-index:201;transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.9,.3,1);max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch;border-top:1px solid var(--border2)}
.modal.visible{transform:translateY(0)}
.modal-handle{width:40px;height:4px;border-radius:2px;background:var(--border2);margin:0 auto 16px}
.modal-title{font-size:18px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(180deg,rgba(24,13,40,.9),rgba(18,9,30,.98));backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid var(--border);padding:8px 12px;padding-bottom:calc(8px + env(safe-area-inset-bottom));z-index:100;display:flex;justify-content:space-around;max-width:640px;margin:0 auto}
.nav-btn{flex:1;background:none;border:none;color:var(--ink3);display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;cursor:pointer;font-family:inherit;font-size:10px;font-weight:600;transition:color .15s;position:relative}
.nav-btn.active{color:var(--rose2)}
.nav-btn .nav-icon{font-size:20px;line-height:1;transition:transform .2s}
.nav-btn.active .nav-icon{transform:scale(1.1)}
.nav-btn.create{color:#fff}
.nav-btn.create .nav-icon{background:var(--grad-main);width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;box-shadow:var(--shadow);margin-top:-12px;border:3px solid var(--bg)}
.console-panel{position:fixed;bottom:0;left:0;right:0;height:40vh;background:rgba(10,6,18,.98);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:2px solid var(--rose);z-index:150;transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.9,.3,1);display:flex;flex-direction:column;max-width:640px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom)}
.console-panel.visible{transform:translateY(0)}
.console-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border);flex-shrink:0}
.console-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--rose2);display:flex;align-items:center;gap:8px}
.console-filters{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:6px 10px;border-bottom:1px solid var(--border);flex-shrink:0}
.console-filters::-webkit-scrollbar{display:none}
.cf{padding:4px 10px;border-radius:999px;border:1px solid var(--border);background:transparent;color:var(--ink3);font-size:11px;font-weight:600;font-family:inherit;cursor:pointer;white-space:nowrap}
.cf.active{background:rgba(255,77,157,.15);color:var(--rose2);border-color:rgba(255,77,157,.4)}
.console-body{flex:1;overflow-y:auto;padding:8px 14px 20px;font-family:var(--mono);font-size:11px;line-height:1.6;-webkit-overflow-scrolling:touch}
.log-line{padding:3px 0;border-bottom:1px solid rgba(45,27,74,.3);word-break:break-word}
.log-time{color:var(--ink4);margin-right:6px}
.log-cat{font-weight:700;margin-right:6px}
.log-cat.SYSTEM{color:var(--violet2)}
.log-cat.AGENT{color:var(--fuchsia)}
.log-cat.QUEUE{color:var(--info)}
.log-cat.IMAGE{color:var(--rose2)}
.log-cat.VIDEO{color:var(--fuchsia)}
.log-cat.VERIFY{color:var(--warn)}
.log-cat.ERROR{color:var(--error)}
.log-msg{color:var(--ink2)}
.status-bar{position:fixed;bottom:calc(64px + env(safe-area-inset-bottom));left:16px;right:16px;background:var(--grad-panel);border:1px solid var(--border2);border-radius:14px;padding:12px 16px;font-size:13px;font-weight:600;color:var(--ink);z-index:99;display:flex;align-items:center;gap:10px;transform:translateY(200px);transition:transform .3s;box-shadow:0 8px 32px rgba(0,0,0,.5);max-width:608px;margin:0 auto}
.status-bar.visible{transform:translateY(0)}
.spinner{width:14px;height:14px;border:2px solid rgba(255,77,157,.2);border-top-color:var(--rose);border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.list-item{display:flex;align-items:center;gap:12px;padding:12px;background:var(--panel);border:1px solid var(--border);border-radius:12px;margin-bottom:8px;cursor:pointer;transition:all .15s}
.list-item:active{background:var(--panel2);transform:scale(.99)}
.list-item.selected{border-color:var(--rose);background:linear-gradient(135deg,rgba(255,77,157,.08),rgba(217,70,239,.05))}
.list-thumb{width:44px;height:44px;border-radius:10px;background:var(--panel2);flex-shrink:0;display:grid;place-items:center;overflow:hidden;font-size:18px;color:var(--ink3);border:1px solid var(--border)}
.list-thumb img{width:100%;height:100%;object-fit:cover}
.list-info{flex:1;min-width:0}
.list-name{font-size:14px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-sub{font-size:12px;color:var(--ink3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lock{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;background:rgba(255,77,157,.12);color:var(--rose2);border:1px solid rgba(255,77,157,.3);font-size:10px;font-weight:700;cursor:pointer;margin:2px;font-family:inherit}
.lock.off{background:rgba(122,101,150,.1);color:var(--ink3);border-color:var(--border)}
.lock.locked{background:rgba(255,77,157,.2);border-color:var(--rose)}
.task-item{display:flex;gap:10px;padding:10px 12px;background:var(--panel);border:1px solid var(--border);border-radius:10px;margin-bottom:6px;font-size:12px;align-items:center}
.task-status{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:var(--ink3)}
.task-status.QUEUED{background:var(--ink3)}
.task-status.RUNNING{background:var(--info);animation:pulse 1.5s infinite}
.task-status.VERIFYING{background:var(--warn);animation:pulse 1.5s infinite}
.task-status.COMPLETED{background:var(--success)}
.task-status.FAILED{background:var(--error)}
.task-status.RETRYING{background:var(--warn);animation:pulse 1.5s infinite}
.task-status.CANCELLED{background:var(--ink4)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.gallery-item{aspect-ratio:9/16;border-radius:10px;overflow:hidden;background:var(--panel);border:1px solid var(--border);position:relative;cursor:pointer}
.gallery-item img,.gallery-item video{width:100%;height:100%;object-fit:cover;display:block}
.gallery-item .badge{position:absolute;bottom:4px;left:4px;font-size:9px;padding:2px 6px;border-radius:6px;background:rgba(0,0,0,.7);color:#fff;font-weight:700;backdrop-filter:blur(8px)}
.hidden{display:none!important}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .3s ease}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="app-header" id="appHeader">
    <div class="logo"><span>✦</span></div>
    <div class="app-title">Studio<small id="headerSubtitle">Chargement…</small></div>
    <div class="header-actions">
      <button class="icon-btn" id="btnConsole" title="Console">▤</button>
      <button class="icon-btn" id="btnMenu" title="Menu">☰</button>
    </div>
  </header>
  <div id="tabsContainer"></div>
  <div id="view-root"></div>
</div>
<nav class="bottom-nav" id="bottomNav">
  <button class="nav-btn" data-view="home"><span class="nav-icon">◈</span>Accueil</button>
  <button class="nav-btn" data-view="agent"><span class="nav-icon">◉</span>Agent</button>
  <button class="nav-btn create" data-view="create"><span class="nav-icon">＋</span>Créer</button>
  <button class="nav-btn" data-view="library"><span class="nav-icon">▦</span>Bibliothèque</button>
  <button class="nav-btn" data-view="profile"><span class="nav-icon">◐</span>Profil</button>
</nav>
<div class="console-panel" id="consolePanel">
  <div class="console-head">
    <div class="console-title">▤ Console <span id="consoleCount" style="color:var(--ink3);font-weight:600">0</span></div>
    <div style="display:flex;gap:6px">
      <button class="icon-btn" id="consoleClear" style="width:28px;height:28px;font-size:12px">✕</button>
      <button class="icon-btn" id="consoleClose" style="width:28px;height:28px;font-size:12px">▼</button>
    </div>
  </div>
  <div class="console-filters" id="consoleFilters">
    <button class="cf active" data-filter="ALL">Tout</button>
    <button class="cf" data-filter="SYSTEM">Système</button>
    <button class="cf" data-filter="QUEUE">File</button>
    <button class="cf" data-filter="IMAGE">Image</button>
    <button class="cf" data-filter="VIDEO">Vidéo</button>
    <button class="cf" data-filter="VERIFY">Vérif</button>
    <button class="cf" data-filter="ERROR">Erreurs</button>
  </div>
  <div class="console-body" id="consoleBody"></div>
</div>
<div class="status-bar" id="statusBar"><div class="spinner"></div><span id="statusText">Préparation…</span></div>
<div class="toast" id="toast"><span id="toastIcon">✓</span><span id="toastText">Message</span></div>
<div class="modal-backdrop" id="modalBackdrop"></div>
<div class="modal" id="modal"></div>

<script>
'use strict';

const PLATFORM = {
  version: '0.1.0',
  dbName: 'studio_db',
  dbVersion: 1,
  retryMax: 3,
  pollIntervalMs: 5000,
  constraintPriority: { LOCKED: 100, PROJECT: 75, SCENE: 50, SHOT: 25, GENERATION: 10 },
  stores: { projects:'projects', characters:'characters', environments:'environments', references:'references', scenes:'scenes', shots:'shots', prompts:'prompts', tasks:'tasks', results:'results', protocols:'protocols', jobs:'jobs', eventLog:'eventLog' },
  lsKeys: { lastProjectId:'studio_last_project', wakeLock:'studio_wakelock', apiKey:'studio_api_key' }
};

const IdGen = (() => {
  const prefixes = { project:'prj', character:'chr', environment:'env', reference:'ref', scene:'scn', shot:'sht', prompt:'prm', task:'tsk', result:'res', protocol:'prt', job:'job', provider:'prv', model:'mdl', event:'evt', constraint:'cst', lock:'lck' };
  function randomChars(n) {
    const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
    let out = '';
    const arr = new Uint8Array(n);
    (window.crypto || window.msCrypto).getRandomValues(arr);
    for (let i = 0; i < n; i++) out += chars[arr[i] % chars.length];
    return out;
  }
  return {
    new(type) { return (prefixes[type] || 'id') + '_' + Date.now().toString(36) + randomChars(6); },
    short() { return randomChars(8); }
  };
})();

const EventBus = (() => {
  const listeners = new Map();
  const log = [];
  function emit(type, payload = {}) {
    const entry = { id: IdGen.new('event'), type, timestamp: Date.now(), projectId: payload.projectId || AppState.getCurrentProjectId() || null, category: payload.category || 'SYSTEM', message: payload.message || type, data: payload.data || null };
    log.push(entry);
    if (log.length > 2000) log.shift();
    const set = listeners.get(type) || new Set();
    for (const fn of set) { try { fn(entry); } catch (e) { console.error('[EventBus]', type, e); } }
    const all = listeners.get('*') || new Set();
    for (const fn of all) { try { fn(entry); } catch (e) { console.error('[EventBus]', '*', e); } }
    if (typeof Console !== 'undefined') Console.log(entry);
    return entry;
  }
  function on(type, fn) {
    if (!listeners.has(type)) listeners.set(type, new Set());
    listeners.get(type).add(fn);
    return () => listeners.get(type).delete(fn);
  }
  function getLog() { return log.slice(); }
  function clearLog() { log.length = 0; }
  return { emit, on, getLog, clearLog };
})();

const StorageEngine = (() => {
  let db = null;
  function open() {
    if (db) return Promise.resolve(db);
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(PLATFORM.dbName, PLATFORM.dbVersion);
      req.onupgradeneeded = (e) => {
        const d = e.target.result;
        for (const name of Object.values(PLATFORM.stores)) {
          if (!d.objectStoreNames.contains(name)) {
            const store = d.createObjectStore(name, { keyPath: 'id' });
            if (name !== 'eventLog') store.createIndex('projectId', 'projectId', { unique: false });
            if (name === 'tasks') store.createIndex('status', 'status', { unique: false });
            if (name === 'shots') store.createIndex('sceneId', 'sceneId', { unique: false });
          }
        }
      };
      req.onsuccess = () => { db = req.result; resolve(db); };
      req.onerror = () => reject(req.error);
    });
  }
  async function tx(storeName, mode, fn) {
    const d = await open();
    return new Promise((resolve, reject) => {
      const t = d.transaction(storeName, mode);
      const store = t.objectStore(storeName);
      const req = fn(store);
      t.oncomplete = () => resolve(req && req.result !== undefined ? req.result : null);
      t.onerror = () => reject(t.error);
      t.onabort = () => reject(t.error);
    });
  }
  async function put(s, o) { return tx(s, 'readwrite', st => st.put(o)); }
  async function get(s, id) { return tx(s, 'readonly', st => st.get(id)); }
  async function del(s, id) { return tx(s, 'readwrite', st => st.delete(id)); }
  async function getAll(s) { return tx(s, 'readonly', st => st.getAll()); }
  async function getAllByIndex(s, i, v) {
    const d = await open();
    return new Promise((resolve, reject) => {
      const t = d.transaction(s, 'readonly');
      const idx = t.objectStore(s).index(i);
      const req = idx.getAll(v);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);

  }

})();

const PromptEngine = (() => {
  function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
  function applyConstraint(c, map, conflicts) {
    const existing = map.get(c.target);
    if (!existing) { map.set(c.target, c); return; }
    if (existing.value.toLowerCase() !== c.value.toLowerCase()) {
      let winner, loser;
      if (c.priority > existing.priority) { winner = c; loser = existing; map.set(c.target, c); }
      else { winner = existing; loser = c; }
      conflicts.push({ id: IdGen.new('constraint'), target: c.target, winner, loser, resolution: winner.type === 'LOCKED' ? 'LOCKED_WINS' : 'MANUAL', message: `Conflit "${c.target}" : "${winner.value}" (${winner.type}) l'emporte sur "${loser.value}" (${loser.type}).`, detectedAt: Date.now() });
      EventBus.emit('CONFLICT_DETECTED', { category: 'AGENT', message: `⚠️ Conflit sur "${c.target}"`, data: { winner, loser } });
    } else if (c.priority > existing.priority) map.set(c.target, c);
  }
  function mergeLayers(layers) {
    const sorted = [...layers].sort((a, b) => a.order - b.order);
    const layersUsed = [];
    const conflicts = [];
    const constraintByTarget = new Map();
    for (const layer of sorted) {
      if (!layer.content || !layer.content.trim()) continue;
      layersUsed.push(layer.kind);
      if (layer.locks && layer.locks.length) {
        for (const lock of layer.locks) {
          applyConstraint({ id: IdGen.new('constraint'), type: 'LOCKED', target: lock.field, value: lock.value, source: lock.sourceId, priority: PLATFORM.constraintPriority.LOCKED, onConflict: 'LOCKED_WINS' }, constraintByTarget, conflicts);
        }
      }
      if (layer.constraints && layer.constraints.length) {
        for (const c of layer.constraints) applyConstraint(c, constraintByTarget, conflicts);
      }
    }
    const parts = [];
    const seen = new Set();
    for (const layer of sorted) {
      if (!layer.content || !layer.content.trim()) continue;
      let content = layer.content.trim();
      for (const c of constraintByTarget.values()) {
        if (c.type === 'LOCKED' && content.toLowerCase().includes(c.value.toLowerCase())) {
          content = content.replace(new RegExp(escapeRegex(c.value), 'gi'), '').trim();
        }
      }
      const key = content.toLowerCase();
      if (content && !seen.has(key)) { seen.add(key); parts.push(content); }
    }
    for (const c of constraintByTarget.values()) {
      if (c.type === 'LOCKED') parts.push(`[LOCKED: ${c.target} = ${c.value}]`);
    }
    return { final: parts.join('. ').replace(/\.\s*\./g, '.').trim(), conflicts, layersUsed };
  }
  async function buildContext(ctx) {
    const { project, characterIds = [], environmentId = null, referenceIds = [], scene = null, shot = null, generationType = 'IMAGE', technicalParameters = {}, masterPromptOverride = null } = ctx;
    const layers = [];
    const locks = [];
    const constraints = [];
    const masterEnabled = masterPromptOverride !== false && project.masterPrompt && project.masterPrompt.content;
    if (masterEnabled) layers.push({ kind: 'MASTER', content: project.masterPrompt.content, order: 1 });
    if (project.description) layers.push({ kind: 'PROJECT', content: project.description, order: 2 });
    if (project.globalStyle) layers.push({ kind: 'STYLE', content: project.globalStyle, order: 3 });
    if (project.constraints && project.constraints.length) {
      const content = project.constraints.map(c => c.value).filter(Boolean).join(', ');
      if (content) layers.push({ kind: 'CONSTRAINTS', content, order: 4, constraints: project.constraints });
    }
    const characters = (await Promise.all(characterIds.map(id => StorageEngine.get('characters', id)))).filter(Boolean);
    if (characters.length) {
      const content = characters.map(c => c.identityPrompt || c.description || c.name).filter(Boolean).join('. ');
      const charLocks = [];
      for (const c of characters) {
        if (c.locks) for (const k of Object.keys(c.locks)) {
          const lock = c.locks[k];
          if (lock && lock.value) { charLocks.push(lock); locks.push(lock); }
        }
      }
      if (content) layers.push({ kind: 'CHARACTERS', content, order: 5, locks: charLocks });
    }
    let envName = null;
    if (environmentId) {
      const env = await StorageEngine.get('environments', environmentId);
      if (env) {
        envName = env.name;
        const content = env.prompt || env.description || env.name;
        const envLocks = [];
        if (env.locks) for (const k of Object.keys(env.locks)) {
          const lock = env.locks[k];
          if (lock && lock.value) { envLocks.push(lock); locks.push(lock); }
        }
        if (content) layers.push({ kind: 'ENVIRONMENTS', content, order: 6, locks: envLocks });
      }
    }
    const refs = (await Promise.all(referenceIds.map(id => StorageEngine.get('references', id)))).filter(r => r && r.active);
    if (refs.length) {
      const lockedRefs = refs.filter(r => r.locked && r.description);
      if (lockedRefs.length) layers.push({ kind: 'REFERENCES', content: lockedRefs.map(r => r.description).join('. '), order: 7 });
    }
    if (scene) {
      const content = [scene.title, scene.description].filter(Boolean).join(' — ');
      if (content) layers.push({ kind: 'SCENE', content, order: 8, constraints: scene.constraints || [] });
    }
    if (shot) {
      const content = generationType === 'VIDEO' ? (shot.videoPrompt || shot.description) : (shot.imagePrompt || shot.description);
      if (content) layers.push({ kind: 'SHOT', content, order: 9, constraints: shot.constraints || [] });
    }
    const genInstr = generationType === 'IMAGE' ? 'Portrait 9:16 vertical, cinematic photography, high detail, no text, no watermark' : 'Portrait 9:16 vertical, 24fps, smooth cinematic motion, no text, no watermark';
    layers.push({ kind: 'GENERATION', content: genInstr, order: 10 });
    const techParts = [];
    for (const [k, v] of Object.entries(technicalParameters)) {
      if (v !== undefined && v !== null && v !== '') techParts.push(`${k}: ${v}`);
    }
    if (techParts.length) layers.push({ kind: 'TECHNICAL', content: techParts.join(', '), order: 11 });
    const merged = mergeLayers(layers);
    return { prompt: merged.final, layersUsed: merged.layersUsed, conflicts: merged.conflicts, locks, constraints, snapshot: { masterPromptEnabled: masterEnabled, characterNames: characters.map(c => c.name), environmentName: envName, referenceIds, locksApplied: locks, constraintsApplied: constraints } };
  }
  async function buildAndSave(ctx) {
    const built = await buildContext(ctx);
    const prompt = { id: IdGen.new('prompt'), projectId: ctx.project.id, sceneId: ctx.scene ? ctx.scene.id : null, shotId: ctx.shot ? ctx.shot.id : null, taskId: null, original: ctx.shot ? (ctx.shot.imagePrompt || ctx.shot.videoPrompt || '') : '', final: built.prompt, layersUsed: built.layersUsed, conflicts: built.conflicts, context: built.snapshot, createdAt: Date.now() };
    await StorageEngine.put('prompts', prompt);
    EventBus.emit('PROMPT_BUILT', { category: 'AGENT', message: `Prompt construit (${built.layersUsed.length} couches, ${built.conflicts.length} conflits)`, data: { promptId: prompt.id } });
    return prompt;
  }
  return { buildContext, buildAndSave, mergeLayers };
})();

const ApiClient = (() => {
  function getKey() { try { return (localStorage.getItem(PLATFORM.lsKeys.apiKey) || '').trim(); } catch (e) { return ''; } }
  function setKey(k) { try { if (k) localStorage.setItem(PLATFORM.lsKeys.apiKey, k); else localStorage.removeItem(PLATFORM.lsKeys.apiKey); } catch (e) {} }
  async function fetchWithRetry(url, options = {}, maxRetries = 3, label = 'API') {
    for (let attempt = 0; attempt <= maxRetries; attempt++) {
      try {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 60000);
        const res = await fetch(url, Object.assign({}, options, { signal: controller.signal }));
        clearTimeout(timeout);
        if (res.status === 429 && attempt < maxRetries) {
          const wait = Math.min(60000, Math.pow(2, attempt) * 5000);
          EventBus.emit('RATE_LIMIT_HIT', { category: 'ERROR', message: `${label} : 429, attente ${Math.round(wait/1000)}s` });
          await new Promise(r => setTimeout(r, wait));
          continue;
        }
        if ((res.status === 500 || res.status === 502 || res.status === 503 || res.status === 520) && attempt < maxRetries) {
          await new Promise(r => setTimeout(r, Math.pow(2, attempt) * 3000));
          continue;
        }
        return res;
      } catch (e) {
        if (attempt < maxRetries) await new Promise(r => setTimeout(r, Math.pow(2, attempt) * 2000));
        else throw e;
      }
    }
    throw new Error(`${label} : échec après ${maxRetries} tentatives`);
  }
  async function generateImage({ prompt, references = [], parameters = {} }) {
    const key = getKey();
    if (!key) throw new Error('NOT_CONFIGURED : clé API manquante');
    const body = { model: AGNES.models.image, prompt, n: 1, size: parameters.size || '1024x1792', response_format: 'url' };
    const res = await fetchWithRetry(AGNES.apiBase + '/images/generations', { method: 'POST', headers: { 'Authorization': 'Bearer ' + key, 'Content-Type': 'application/json' }, body: JSON.stringify(body) }, 3, 'Image');
    if (!res.ok) { const err = await res.text(); throw new Error(`Image HTTP ${res.status} — ${err.slice(0, 200)}`); }
    const data = await res.json();
    const item = data.data && data.data[0];
    const url = item && (item.url || (item.b64_json ? 'data:image/png;base64,' + item.b64_json : null));
    if (!url) throw new Error('Aucune URL image retournée');
    return { url, raw: data };
  }
  async function createVideoTask({ prompt, firstFrame = null, lastFrame = null, parameters = {} }) {
    const key = getKey();
    if (!key) throw new Error('NOT_CONFIGURED : clé API manquante');
    const durationSec = parameters.duration || 6.4;
    const numFrames = Math.max(121, Math.round(durationSec * AGNES.frameRate));
    const body = { model: AGNES.models.video, prompt, num_frames: numFrames, frame_rate: AGNES.frameRate };
    if (firstFrame && lastFrame) { body.image = firstFrame; body.last_frame = lastFrame; }
    else if (firstFrame) { body.image = firstFrame; }
    const res = await fetchWithRetry(AGNES.apiBase + '/videos', { method: 'POST', headers: { 'Authorization': 'Bearer ' + key, 'Content-Type': 'application/json' }, body: JSON.stringify(body) }, 3, 'Vidéo');
    if (!res.ok) { const err = await res.text(); throw new Error(`Vidéo HTTP ${res.status} — ${err.slice(0, 200)}`); }
    const data = await res.json();
    const videoId = data.video_id || data.id || data.task_id;
    if (!videoId) throw new Error('Aucun video_id retourné');
    return { videoId, raw: data };
  }
  async function pollVideo(videoId) {
    const key = getKey();
    if (!key) throw new Error('NOT_CONFIGURED : clé API manquante');
    const url = AGNES.pollBase + '?video_id=' + encodeURIComponent(videoId) + '&model_name=' + encodeURIComponent(AGNES.models.video);
    const res = await fetchWithRetry(url, { method: 'GET', headers: { 'Authorization': 'Bearer ' + key } }, 2, 'Poll');
    if (!res.ok) throw new Error(`Poll HTTP ${res.status}`);
    const data = await res.json();
    const status = data.status || 'unknown';
    const progress = data.progress || 0;
    let videoUrl = null;
    if (status === 'completed' || status === 'succeeded' || status === 'done') {
      videoUrl = (data.metadata && data.metadata.url) || data.url || (data.output && data.output.url) || null;
    }
    return { status, progress, videoUrl, raw: data };
  }
  return { getKey, setKey, generateImage, createVideoTask, pollVideo };
})();

const QueueEngine = (() => {
  let loopRunning = false;
  let loopTimer = null;
  async function createTask(opts) {
    const { projectId, sceneId, shotId = null, type, promptOriginal, promptFinal, promptId = null, referencesUsed = [], charactersUsed = [], environmentsUsed = [], constraints = [], parameters = {} } = opts;
    const task = {
      id: IdGen.new('task'), projectId, sceneId, shotId, type, promptOriginal, promptFinal, promptId,
      referencesUsed, charactersUsed, environmentsUsed, constraints,
      providerId: 'agnes', modelId: type === 'IMAGE' ? AGNES.models.image : AGNES.models.video,
      parameters: { providerId: 'agnes', modelId: type === 'IMAGE' ? AGNES.models.image : AGNES.models.video, values: parameters },
      status: 'QUEUED', progress: 0, retryCount: 0, error: null, providerTaskId: null, resultId: null,
      createdAt: Date.now(), startedAt: null, completedAt: null
    };
    await StorageEngine.put('tasks', task);
    EventBus.emit('TASK_QUEUED', { category: type === 'IMAGE' ? 'IMAGE' : 'VIDEO', message: `Tâche en file (${type})`, data: { taskId: task.id } });
    return task;
  }
  function estimateTime(tasks) {
    if (!tasks.length) return { minMs: 0, maxMs: 0 };
    const imgCount = tasks.filter(t => t.type === 'IMAGE').length;
    const vidCount = tasks.filter(t => t.type === 'VIDEO').length;
    const imageMs = imgCount > 0 ? (imgCount * AGNES.limits.image.createIntervalMs) + AGNES.limits.image.avgGenerationTimeMs : 0;
    const videoCreateMs = vidCount * AGNES.limits.video.createIntervalMs;
    const videoGenMs = vidCount > 0 ? Math.ceil(vidCount / Math.max(1, AGNES.limits.video.rpm)) * AGNES.limits.video.avgGenerationTimeMs : 0;
    const videoMs = videoCreateMs + videoGenMs;
    const totalMs = Math.max(imageMs, videoMs);
    return { minMs: Math.round(totalMs * 0.85), maxMs: Math.round(totalMs * 1.35) };
  }
  function formatDuration(ms) {
    const s = Math.round(ms / 1000);
    if (s < 60) return s + 's';
    const m = Math.floor(s / 60);
    const sec = s % 60;
    if (m < 60) return m + 'min' + (sec ? ' ' + sec + 's' : '');
    const h = Math.floor(m / 60);
    const min = m % 60;
    return h + 'h' + (min ? ' ' + min + 'min' : '');
  }
  function startLoop() { if (loopRunning) return; loopRunning = true; tick(); }
  async function tick() { if (!loopRunning) return; try { await processQueue(); } catch (e) { console.error('[Queue]', e); } loopTimer = setTimeout(tick, 3000); }
  function stopLoop() { loopRunning = false; if (loopTimer) { clearTimeout(loopTimer); loopTimer = null; } }
  async function processQueue() {
    const allTasks = await StorageEngine.getAll('tasks');
    const queued = allTasks.filter(t => t.status === 'QUEUED');
    const runningImage = allTasks.filter(t => t.type === 'IMAGE' && (t.status === 'RUNNING' || t.status === 'VERIFYING')).length;
    const runningVideo = allTasks.filter(t => t.type === 'VIDEO' && (t.status === 'RUNNING' || t.status === 'VERIFYING')).length;
    const imgToStart = queued.filter(t => t.type === 'IMAGE').slice(0, Math.max(0, 3 - runningImage));
    const vidToStart = queued.filter(t => t.type === 'VIDEO').slice(0, Math.max(0, 1 - runningVideo));
    for (const t of imgToStart) runTask(t);
    for (const t of vidToStart) runTask(t);
  }
  async function runTask(task) {
    task.status = 'RUNNING'; task.startedAt = Date.now(); task.progress = 5;
    await StorageEngine.put('tasks', task);
    EventBus.emit('TASK_STARTED', { category: task.type === 'IMAGE' ? 'IMAGE' : 'VIDEO', message: `${task.type} — début`, data: { taskId: task.id } });
    try {
      if (task.type === 'IMAGE') await runImageTask(task);
      else await runVideoTask(task);
    } catch (e) {
      if (e.message === 'CANCELLED') { task.status = 'CANCELLED'; await StorageEngine.put('tasks', task); return; }
      if (task.retryCount < PLATFORM.retryMax) {
        task.retryCount++;
        task.status = 'RETRYING';
        const wait = Math.min(60000, 5000 * Math.pow(2, task.retryCount - 1));
        EventBus.emit('TASK_RETRYING', { category: 'ERROR', message: `Retry ${task.retryCount}/3 dans ${Math.round(wait/1000)}s : ${e.message}`, data: { taskId: task.id } });
        await StorageEngine.put('tasks', task);
        setTimeout(async () => { task.status = 'QUEUED'; task.progress = 0; await StorageEngine.put('tasks', task); }, wait);
      } else {
        task.status = 'FAILED'; task.error = e.message; task.completedAt = Date.now();
        await StorageEngine.put('tasks', task);
        EventBus.emit('TASK_FAILED', { category: 'ERROR', message: `Échec : ${e.message}`, data: { taskId: task.id } });
      }
    }
  }
  async function runImageTask(task) {
    task.progress = 20; await StorageEngine.put('tasks', task);
    const result = await ApiClient.generateImage({ prompt: task.promptFinal, references: task.referencesUsed, parameters: task.parameters.values });
    task.progress = 90; await StorageEngine.put('tasks', task);
    const genResult = { id: IdGen.new('result'), taskId: task.id, projectId: task.projectId, type: 'IMAGE', url: result.url, metadata: { size: task.parameters.values.size || '1024x1792' }, verification: null, createdAt: Date.now() };
    await StorageEngine.put('results', genResult);
    task.status = 'COMPLETED'; task.progress = 100; task.resultId = genResult.id; task.completedAt = Date.now();
    await StorageEngine.put('tasks', task);
    EventBus.emit('TASK_COMPLETED', { category: 'IMAGE', message: '✓ Image générée', data: { taskId: task.id } });
  }
  async function runVideoTask(task) {
    task.progress = 10; await StorageEngine.put('tasks', task);
    const firstFrame = task.parameters.values.firstFrame || null;
    const lastFrame = task.parameters.values.lastFrame || null;
    const created = await ApiClient.createVideoTask({ prompt: task.promptFinal, firstFrame, lastFrame, parameters: task.parameters.values });
    task.providerTaskId = created.videoId; task.progress = 25;
    await StorageEngine.put('tasks', task);
    EventBus.emit('TASK_PROGRESS', { category: 'VIDEO', message: `Tâche créée (id: ${String(created.videoId).slice(0,16)}…)`, data: { taskId: task.id } });
    const maxAttempts = 200;
    for (let attempt = 1; attempt <= maxAttempts; attempt++) {
      await new Promise(r => setTimeout(r, 8000));
      const fresh = await StorageEngine.get('tasks', task.id);
      if (!fresh || fresh.status === 'CANCELLED') throw new Error('CANCELLED');
      try {
        const poll = await ApiClient.pollVideo(task.providerTaskId);
        task.progress = Math.min(95, 25 + Math.round((poll.progress || attempt / 2) * 0.7));
        await StorageEngine.put('tasks', task);
        EventBus.emit('TASK_PROGRESS', { category: 'VIDEO', message: `Poll #${attempt} — ${poll.status}`, data: { taskId: task.id } });
        if (poll.videoUrl) {
          const genResult = { id: IdGen.new('result'), taskId: task.id, projectId: task.projectId, type: 'VIDEO', url: poll.videoUrl, metadata: { duration: task.parameters.values.duration || 6.4 }, verification: null, createdAt: Date.now() };
          await StorageEngine.put('results', genResult);
          task.status = 'COMPLETED'; task.progress = 100; task.resultId = genResult.id; task.completedAt = Date.now();
          await StorageEngine.put('tasks', task);
          EventBus.emit('TASK_COMPLETED', { category: 'VIDEO', message: '✓ Vidéo générée', data: { taskId: task.id } });
          return;
        }
        if (poll.status === 'failed' || poll.status === 'error' || poll.status === 'cancelled') throw new Error(`Provider : ${poll.status}`);
      } catch (e) {
        if (e.message === 'CANCELLED') throw e;
        EventBus.emit('TASK_PROGRESS', { category: 'VIDEO', message: `Poll erreur : ${e.message}`, data: { taskId: task.id } });
      }
    }
    throw new Error('Délai maximal dépassé');
  }
  async function cancelTask(taskId) {
    const task = await StorageEngine.get('tasks', taskId);
    if (!task) return;
    if (['QUEUED','RUNNING','RETRYING'].includes(task.status)) {
      task.status = 'CANCELLED';
      await StorageEngine.put('tasks', task);
      EventBus.emit('TASK_CANCELLED', { category: 'QUEUE', message: 'Tâche annulée', data: { taskId } });
    }
  }
  async function listByProject(projectId) {
    const tasks = await StorageEngine.getAllByIndex('tasks', 'projectId', projectId);
    return tasks.sort((a, b) => b.createdAt - a.createdAt);
  }
  async function getStats(projectId) {
    const tasks = await listByProject(projectId);
    return {
      total: tasks.length,
      queued: tasks.filter(t => t.status === 'QUEUED').length,
      running: tasks.filter(t => t.status === 'RUNNING' || t.status === 'VERIFYING').length,
      retrying: tasks.filter(t => t.status === 'RETRYING').length,
      completed: tasks.filter(t => t.status === 'COMPLETED').length,
      failed: tasks.filter(t => t.status === 'FAILED').length,
      cancelled: tasks.filter(t => t.status === 'CANCELLED').length,
      tasks
    };
  }
  return { createTask, estimateTime, formatDuration, startLoop, stopLoop, processQueue, cancelTask, listByProject, getStats };
})();

const ExportEngine = (() => {
  let crcTable = null;
  function crc32(data) {
    if (!crcTable) {
      crcTable = new Uint32Array(256);
      for (let i = 0; i < 256; i++) {
        let c = i;
        for (let j = 0; j < 8; j++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
        crcTable[i] = c;
      }
    }
    let crc = 0xFFFFFFFF;
    for (let i = 0; i < data.length; i++) crc = crcTable[(crc ^ data[i]) & 0xFF] ^ (crc >>> 8);
    return (crc ^ 0xFFFFFFFF) >>> 0;
  }
  function buildZipStore(files) {
    const chunks = [];
    const centralDirectory = [];
    let offset = 0;
    const encoder = new TextEncoder();
    for (const file of files) {
      const nameBytes = encoder.encode(file.name);
      const crc = crc32(file.data);
      const size = file.data.length;
      const lfh = new Uint8Array(30 + nameBytes.length);
      const dv = new DataView(lfh.buffer);
      dv.setUint32(0, 0x04034b50, true);
      dv.setUint16(4, 20, true); dv.setUint16(6, 0, true); dv.setUint16(8, 0, true);
      dv.setUint16(10, 0, true); dv.setUint16(12, 0, true);
      dv.setUint32(14, crc, true); dv.setUint32(18, size, true); dv.setUint32(22, size, true);
      dv.setUint16(26, nameBytes.length, true); dv.setUint16(28, 0, true);
      lfh.set(nameBytes, 30);
      chunks.push(lfh, file.data);
      const cde = new Uint8Array(46 + nameBytes.length);
      const cdv = new DataView(cde.buffer);
      cdv.setUint32(0, 0x02014b50, true); cdv.setUint16(4, 20, true); cdv.setUint16(6, 20, true);
      cdv.setUint16(8, 0, true); cdv.setUint16(10, 0, true); cdv.setUint16(12, 0, true); cdv.setUint16(14, 0, true);
      cdv.setUint32(16, crc, true); cdv.setUint32(20, size, true); cdv.setUint32(24, size, true);
      cdv.setUint16(28, nameBytes.length, true); cdv.setUint16(30, 0, true); cdv.setUint16(32, 0, true); cdv.setUint16(34, 0, true); cdv.setUint16(36, 0, true);
      cdv.setUint32(38, 0, true); cdv.setUint32(42, offset, true);
      cde.set(nameBytes, 46);
      centralDirectory.push(cde);
      offset += lfh.length + size;
    }
    const cdSize = centralDirectory.reduce((s, c) => s + c.length, 0);
    const eocd = new Uint8Array(22);
    const edv = new DataView(eocd.buffer);
    edv.setUint32(0, 0x06054b50, true); edv.setUint16(4, 0, true); edv.setUint16(6, 0, true);
    edv.setUint16(8, files.length, true); edv.setUint16(10, files.length, true);
    edv.setUint32(12, cdSize, true); edv.setUint32(16, offset, true); edv.setUint16(20, 0, true);
    return new Blob(chunks.concat(centralDirectory, [eocd]));
  }
  function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);
  }
  async function exportProjectZip(projectId) {
    const project = await StorageEngine.get('projects', projectId);
    if (!project) throw new Error('Projet introuvable');
    const tasks = await QueueEngine.listByProject(projectId);
    const doneTasks = tasks.filter(t => t.status === 'COMPLETED' && t.resultId);
    const items = [];
    for (const task of doneTasks) {
      const result = await StorageEngine.get('results', task.resultId);
      if (!result) continue;
      const ext = result.type === 'IMAGE' ? 'png' : 'mp4';
      items.push({ url: result.url, filename: `${result.type.toLowerCase()}_${task.id}.${ext}` });
    }
    if (!items.length) throw new Error('Aucun résultat à exporter');
    const files = [];
    for (const item of items) {
      try { const res = await fetch(item.url); const blob = await res.blob(); const buf = await blob.arrayBuffer(); files.push({ name: item.filename, data: new Uint8Array(buf) }); } catch (e) {}
    }
    const blob = buildZipStore(files);
    downloadBlob(blob, `projet_${project.name.replace(/[^a-z0-9]/gi, '_')}_${Date.now()}.zip`);
  }
  return { exportProjectZip, downloadBlob };
})();

const ProtocolEngine = (() => {
  function normalizeJson(data) {
    return {
      project: { name: (data.project && data.project.name) || 'Projet importé', description: (data.project && data.project.description) || '', masterPrompt: (data.project && data.project.masterPrompt) || data.masterPrompt || '', globalStyle: (data.project && data.project.globalStyle) || data.globalStyle || '' },
      characters: (data.characters || []).map(c => ({ name: c.name || 'Personnage', description: c.description || '', appearance: c.appearance || {}, identityPrompt: c.identityPrompt || c.prompt || '' })),
      environments: (data.environments || []).map(e => ({ name: e.name || 'Décor', description: e.description || '', properties: e.properties || {}, prompt: e.prompt || '' })),
      scenes: (data.scenes || []).map(s => ({ number: s.number || s.scene_number || 1, title: s.title || '', description: s.description || '', characterNames: s.characterNames || s.characters || [], environmentName: s.environmentName || s.environment || null, shots: (s.shots || []).map(sh => ({ number: sh.number || sh.shot_number || 1, description: sh.description || '', imagePrompt: sh.imagePrompt || sh.image_prompt || '', videoPrompt: sh.videoPrompt || sh.video_prompt || '', imageCount: sh.imageCount || 1, videoCount: sh.videoCount || 0, videoDuration: sh.videoDuration || 6.4 })) })),
      constraints: data.constraints || []
    };
  }
  function parseText(raw) {
    const lines = raw.split('\n').map(l => l.trim()).filter(Boolean);
    const result = { project: { name: 'Projet importé', description: '', masterPrompt: '', globalStyle: '' }, characters: [], environments: [], scenes: [], constraints: [] };
    let current = null;
    for (const line of lines) {
      const lower = line.toLowerCase();
      if (lower.startsWith('# projet') || lower.startsWith('## projet')) {
        result.project.name = line.replace(/^#+\s*projet\s*:?\s*/i, '') || 'Projet importé';
      } else if (lower.startsWith('# personnage') || lower.startsWith('## personnage')) {
        current = { type: 'character', data: { name: line.replace(/^#+\s*personnage\s*:?\s*/i, ''), description: '', appearance: {}, identityPrompt: '' } };
      } else if (lower.startsWith('# décor') || lower.startsWith('## décor') || lower.startsWith('# decor')) {
        current = { type: 'environment', data: { name: line.replace(/^#+\s*(décor|decor)\s*:?\s*/i, ''), description: '', properties: {}, prompt: '' } };
      } else if (lower.startsWith('# scène') || lower.startsWith('## scène') || lower.startsWith('# scene')) {
        current = { type: 'scene', data: { number: result.scenes.length + 1, title: line.replace(/^#+\s*(scène|scene)\s*:?\s*/i, ''), description: '', characterNames: [], environmentName: null, shots: [] } };
      } else if (current) {
        if (current.type === 'character') {
          if (lower.startsWith('description')) current.data.description = line.split(':').slice(1).join(':').trim();
          else if (lower.startsWith('prompt')) current.data.identityPrompt = line.split(':').slice(1).join(':').trim();
          else current.data.description += (current.data.description ? ' ' : '') + line;
        } else if (current.type === 'environment') {
          if (lower.startsWith('description')) current.data.description = line.split(':').slice(1).join(':').trim();
          else if (lower.startsWith('prompt')) current.data.prompt = line.split(':').slice(1).join(':').trim();
          else current.data.description += (current.data.description ? ' ' : '') + line;
        } else if (current.type === 'scene') {
          if (lower.startsWith('description')) current.data.description = line.split(':').slice(1).join(':').trim();
          else current.data.description += (current.data.description ? ' ' : '') + line;
        }
      }
    }
    if (current) pushCurrent(result, current);
    return result;
  }
  function pushCurrent(result, current) {
    if (current.type === 'character') result.characters.push(current.data);
    else if (current.type === 'environment') result.environments.push(current.data);
    else if (current.type === 'scene') result.scenes.push(current.data);
  }
  function parse(raw, format) {
    if (format === 'json') {
      try { return normalizeJson(JSON.parse(raw)); }
      catch (e) { throw new Error('JSON invalide : ' + e.message); }
    }
    return parseText(raw);
  }
  async function importProtocol(parsed) {
    const project = await ProjectEngine.create({ name: parsed.project.name, description: parsed.project.description, masterPrompt: parsed.project.masterPrompt, globalStyle: parsed.project.globalStyle });
    const charMap = new Map();
    for (const c of parsed.characters) {
      const created = await CharacterEngine.create({ name: c.name, description: c.description, appearance: c.appearance || {}, identityPrompt: c.identityPrompt || CharacterEngine.buildIdentityPrompt(c) });
      await ProjectEngine.linkCharacter(project.id, created.id);
      charMap.set(c.name.toLowerCase(), created.id);
    }
    const envMap = new Map();
    for (const e of parsed.environments) {
      const created = await EnvironmentEngine.create({ name: e.name, description: e.description, properties: e.properties || {}, prompt: e.prompt || '' });
      await ProjectEngine.linkEnvironment(project.id, created.id);
      envMap.set(e.name.toLowerCase(), created.id);
    }
    for (const s of parsed.scenes) {
      const scene = await SceneEngine.create(project.id, { number: s.number, title: s.title, description: s.description, characterIds: (s.characterNames || []).map(n => charMap.get(n.toLowerCase())).filter(Boolean), environmentId: s.environmentName ? envMap.get(s.environmentName.toLowerCase()) : null });
      for (const sh of s.shots || []) await ShotEngine.create(scene.id, project.id, sh);
    }
    return project;
  }
  return { parse, importProtocol };
})();

<script>
'use strict';

function h(tag, attrs = {}, children = []) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') el.className = v;
    else if (k === 'dataset') Object.assign(el.dataset, v);
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, '');
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  if (typeof children === 'string') el.textContent = children;
  else for (const c of [].concat(children)) {
    if (c == null || c === false) continue;
    el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return el;
}

function escHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

const Toast = (() => {
  let timeout = null;
  function show(msg, type = 'success', duration = 2500) {
    const toast = document.getElementById('toast');
    const icon = document.getElementById('toastIcon');
    const text = document.getElementById('toastText');
    if (!toast) return;
    toast.classList.remove('visible', 'success', 'error', 'warn');
    void toast.offsetWidth;
    icon.textContent = { success: '✓', error: '✕', warn: '⚠' }[type] || '✓';
    text.textContent = msg;
    toast.classList.add(type);
    requestAnimationFrame(() => toast.classList.add('visible'));
    if (timeout) clearTimeout(timeout);
    timeout = setTimeout(() => toast.classList.remove('visible'), duration);
  }
  return { show };
})();

const StatusBar = (() => {
  let hideTimeout = null;
  function show(text, autoHideMs = 0) {
    const bar = document.getElementById('statusBar');
    const t = document.getElementById('statusText');
    if (!bar) return;
    t.textContent = text;
    bar.classList.add('visible');
    if (hideTimeout) clearTimeout(hideTimeout);
    if (autoHideMs > 0) hideTimeout = setTimeout(hide, autoHideMs);
  }
  function hide() { const bar = document.getElementById('statusBar'); if (bar) bar.classList.remove('visible'); }
  return { show, hide };
})();

const Modal = (() => {
  let currentCloser = null;
  function open(contentNode) {
    const backdrop = document.getElementById('modalBackdrop');
    const modal = document.getElementById('modal');
    if (!modal) return;
    modal.innerHTML = '';
    modal.appendChild(h('div', { class: 'modal-handle' }));
    modal.appendChild(contentNode);
    requestAnimationFrame(() => { backdrop.classList.add('visible'); modal.classList.add('visible'); });
    currentCloser = () => {
      backdrop.classList.remove('visible');
      modal.classList.remove('visible');
      setTimeout(() => { modal.innerHTML = ''; currentCloser = null; }, 350);
    };
  }
  function close() { if (currentCloser) currentCloser(); }
  return { open, close };
})();

document.getElementById('modalBackdrop').addEventListener('click', () => Modal.close());

const AppState = (() => {
  let currentProjectId = null;
  let currentView = 'home';
  let currentProject = null;
  const subscribers = new Set();
  function getCurrentProjectId() { return currentProjectId; }
  function getCurrentProject() { return currentProject; }
  function getCurrentView() { return currentView; }
  async function setCurrentProject(id) {
    currentProjectId = id;
    currentProject = id ? await StorageEngine.get('projects', id) : null;
    if (id) { try { localStorage.setItem(PLATFORM.lsKeys.lastProjectId, id); } catch (e) {} }
    notify();
  }
  function setCurrentView(v) { currentView = v; notify(); }
  function subscribe(fn) { subscribers.add(fn); return () => subscribers.delete(fn); }
  function notify() { for (const fn of subscribers) { try { fn(); } catch (e) { console.error(e); } } }
  return { getCurrentProjectId, getCurrentProject, getCurrentView, setCurrentProject, setCurrentView, subscribe };
})();

const Console = (() => {
  let filter = 'ALL';
  const buffer = [];
  function log(entry) { buffer.push(entry); if (buffer.length > 500) buffer.shift(); render(); }
  function setFilter(f) { filter = f; document.querySelectorAll('#consoleFilters .cf').forEach(b => b.classList.toggle('active', b.dataset.filter === f)); render(); }
  function clear() { buffer.length = 0; EventBus.clearLog(); render(); }
  function render() {
    const body = document.getElementById('consoleBody');
    const count = document.getElementById('consoleCount');
    if (!body) return;
    const filtered = filter === 'ALL' ? buffer : buffer.filter(e => e.category === filter);
    count.textContent = String(filtered.length);
    body.innerHTML = filtered.slice(-200).map(e => {
      const t = new Date(e.timestamp).toLocaleTimeString('fr-FR', { hour12: false });
      return `<div class="log-line"><span class="log-time">${t}</span><span class="log-cat ${e.category}">[${e.category}]</span><span class="log-msg">${escHtml(e.message)}</span></div>`;
    }).join('');
    body.scrollTop = body.scrollHeight;
  }
  return { log, setFilter, clear, render };
})();

async function refreshTasksLive() {
  const el = document.getElementById('tasksLive');
  if (!el) return;
  const projectId = AppState.getCurrentProjectId();
  if (!projectId) return;
  const stats = await QueueEngine.getStats(projectId);
  const active = stats.tasks.filter(t => ['QUEUED','RUNNING','VERIFYING','RETRYING'].includes(t.status));
  if (!active.length && stats.completed === 0) { el.innerHTML = '<div style="color:var(--ink3);font-size:13px">Aucune tâche pour l\'instant</div>'; return; }
  let html = '';
  if (active.length) {
    for (const t of active.slice(0, 10)) {
      html += `<div class="task-item"><span class="task-status ${t.status}"></span><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px">${t.type === 'IMAGE' ? '🖼' : '🎬'} ${escHtml(t.promptFinal.slice(0, 40))}…</span><span style="color:var(--ink3);font-size:11px">${t.progress}%</span><button class="icon-btn" style="width:24px;height:24px;font-size:10px" data-cancel="${t.id}">✕</button></div>`;
    }
    el.innerHTML = html;
    el.querySelectorAll('[data-cancel]').forEach(b => b.addEventListener('click', async () => { await QueueEngine.cancelTask(b.dataset.cancel); refreshTasksLive(); }));
  } else {
    el.innerHTML = `<div style="color:var(--success);font-size:13px">✓ ${stats.completed} tâche${stats.completed > 1 ? 's' : ''} terminée${stats.completed > 1 ? 's' : ''}</div>`;
  }
}

async function generateBatch({ projectId, sceneId, type, count, promptOverride, characterIds, environmentId, duration }) {
  const scene = await SceneEngine.get(sceneId);
  if (!scene) { Toast.show('Scène introuvable', 'error'); return; }
  const shots = await ShotEngine.listByScene(sceneId);
  const shot = shots[0] || null;
  StatusBar.show(`Préparation de ${count} tâche${count > 1 ? 's' : ''}…`);
  try {
    const project = await ProjectEngine.get(projectId);
    for (let i = 0; i < count; i++) {
      const built = await PromptEngine.buildContext({ project, characterIds, environmentId, referenceIds: [].concat(scene.referenceIds || [], shot ? (shot.referenceIds || []) : []), scene, shot, generationType: type, technicalParameters: type === 'VIDEO' ? { duration: duration + 's' } : {}, masterPromptOverride: scene.masterPromptOverride });
      const finalPrompt = promptOverride ? promptOverride + '. ' + built.prompt : built.prompt;
      const promptObj = await PromptEngine.buildAndSave({ project, characterIds, environmentId, referenceIds: [].concat(scene.referenceIds || [], shot ? (shot.referenceIds || []) : []), scene, shot, generationType: type, technicalParameters: type === 'VIDEO' ? { duration: duration + 's' } : {}, masterPromptOverride: scene.masterPromptOverride });
      await QueueEngine.createTask({ projectId, sceneId, shotId: shot ? shot.id : null, type, promptOriginal: promptOverride || (shot ? (type === 'IMAGE' ? shot.imagePrompt : shot.videoPrompt) : ''), promptFinal: finalPrompt, promptId: promptObj.id, referencesUsed: scene.referenceIds || [], charactersUsed: characterIds, environmentsUsed: environmentId ? [environmentId] : [], constraints: built.constraints, parameters: { duration } });
    }
    Toast.show(`${count} tâche${count > 1 ? 's' : ''} en file`, 'success');
    StatusBar.hide();
    QueueEngine.startLoop();
    setTimeout(refreshTasksLive, 500);
  } catch (e) {
    console.error(e);
    StatusBar.hide();
    Toast.show('Erreur : ' + e.message, 'error', 4000);
  }
}

<script>
'use strict';

const WakeLock = (() => {
  let sentinel = null;
  let canvasStream = null;
  let canvasInterval = null;
  function isSupported() { return 'wakeLock' in navigator && typeof navigator.wakeLock.request === 'function'; }
  async function requestAPI() {
    if (!isSupported()) return false;
    try { sentinel = await navigator.wakeLock.request('screen'); sentinel.addEventListener('release', () => { sentinel = null; }); return true; }
    catch (e) { return false; }
  }
  async function releaseAPI() { if (sentinel) { try { await sentinel.release(); } catch (e) {} sentinel = null; } }
  function startCanvasFallback() {
    if (canvasStream) return true;
    try {
      const canvas = document.createElement('canvas');
      canvas.width = 2; canvas.height = 2;
      canvas.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0.01;pointer-events:none;z-index:-1';
      document.body.appendChild(canvas);
      const video = document.createElement('video');
      video.muted = true; video.playsInline = true; video.loop = true;
      video.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0.01;pointer-events:none;z-index:-1';
      document.body.appendChild(video);
      const ctx = canvas.getContext('2d');
      if (!ctx || typeof canvas.captureStream !== 'function') return false;
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 2, 2);
      canvasStream = canvas.captureStream(1);
      let toggle = false;
      canvasInterval = setInterval(() => { toggle = !toggle; ctx.fillStyle = toggle ? '#000' : '#010101'; ctx.fillRect(0, 0, 2, 2); }, 1000);
      video.srcObject = canvasStream;
      video.play().catch(() => {});
      return true;
    } catch (e) { return false; }
  }
  function stopCanvasFallback() {
    if (canvasInterval) { clearInterval(canvasInterval); canvasInterval = null; }
    if (canvasStream) { try { canvasStream.getTracks().forEach(t => t.stop()); } catch (e) {} canvasStream = null; }
  }
  async function activate() { let ok = false; if (isSupported()) ok = await requestAPI(); if (!ok) ok = startCanvasFallback(); return ok; }
  async function deactivate() { await releaseAPI(); stopCanvasFallback(); }
  return { activate, deactivate, isSupported };
})();

function setupAntiRefresh() {
  document.body.style.overscrollBehavior = 'none';
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && e.target.tagName === 'INPUT' && e.target.type !== 'textarea') {
      if (!e.target.classList.contains('allow-enter')) e.preventDefault();
    }
  }, true);
  document.addEventListener('click', (e) => {
    const a = e.target.closest && e.target.closest('a');
    if (a && (!a.getAttribute('href') || a.getAttribute('href') === '#')) e.preventDefault();
  }, true);
}

function setupEventListeners() {
  const refresh = () => { if (AppState.getCurrentView() === 'create') setTimeout(refreshTasksLive, 100); };
  EventBus.on('TASK_QUEUED', refresh);
  EventBus.on('TASK_STARTED', refresh);
  EventBus.on('TASK_PROGRESS', refresh);
  EventBus.on('TASK_COMPLETED', () => { refresh(); if (AppState.getCurrentView() === 'library') Router.render(); });
  EventBus.on('TASK_FAILED', refresh);
  EventBus.on('TASK_CANCELLED', refresh);
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState === 'visible') {
      const enabled = localStorage.getItem(PLATFORM.lsKeys.wakeLock) === '1';
      if (enabled) await WakeLock.activate();
    }
  });
}

function setupWakeLockButton() {
  const actions = document.querySelector('.header-actions');
  if (!actions) return;
  const enabled = localStorage.getItem(PLATFORM.lsKeys.wakeLock) === '1';
  const btn = document.createElement('button');
  btn.className = 'icon-btn';
  btn.title = 'Garder l\'écran allumé';
  btn.textContent = enabled ? '☀' : '☾';
  btn.addEventListener('click', async () => {
    const currentlyEnabled = localStorage.getItem(PLATFORM.lsKeys.wakeLock) === '1';
    if (currentlyEnabled) {
      localStorage.setItem(PLATFORM.lsKeys.wakeLock, '0');
      await WakeLock.deactivate();
      btn.textContent = '☾';
      Toast.show('Veille automatique réactivée', 'warn');
    } else {
      localStorage.setItem(PLATFORM.lsKeys.wakeLock, '1');
      const ok = await WakeLock.activate();
      btn.textContent = ok ? '☀' : '☾';
      Toast.show(ok ? 'Écran va rester allumé' : 'Non supporté', ok ? 'success' : 'warn');
    }
  });
  actions.insertBefore(btn, actions.firstChild);
}

async function resumeQueueIfNeeded() {
  try {
    const allTasks = await StorageEngine.getAll('tasks');
    const pending = allTasks.filter(t => ['QUEUED','RUNNING','RETRYING'].includes(t.status));
    for (const t of pending) {
      if (t.status === 'RUNNING') { t.status = 'QUEUED'; t.progress = 0; await StorageEngine.put('tasks', t); }
    }
    if (pending.length > 0) {
      EventBus.emit('TASK_QUEUED', { category: 'QUEUE', message: `Reprise : ${pending.length} tâche${pending.length > 1 ? 's' : ''} en attente` });
      QueueEngine.startLoop();
    }
  } catch (e) { console.warn('[Resume]', e); }
}

async function selfTest() {
  const results = [];
  function check(name, fn) {
    try { const ok = fn(); results.push({ name, ok, error: null }); }
    catch (e) { results.push({ name, ok: false, error: e.message }); }
  }
  check('IdGen', () => { const a = IdGen.new('project'); const b = IdGen.new('project'); return a !== b && a.startsWith('prj_'); });
  check('EventBus', () => { let received = false; const unsub = EventBus.on('LOG', () => { received = true; }); EventBus.emit('LOG', { message: 'test' }); unsub(); return received; });
  check('PromptEngine merge', () => { const merged = PromptEngine.mergeLayers([{ kind: 'MASTER', content: 'Style cinématographique', order: 1 }, { kind: 'SCENE', content: 'Une femme dans une forêt', order: 8 }]); return merged.final.includes('Style') && merged.final.includes('femme'); });
  check('PromptEngine conflits', () => {
    const merged = PromptEngine.mergeLayers([
      { kind: 'CHARACTERS', content: 'Sarah', order: 5, locks: [{ id: 'l1', field: 'clothing', value: 'veste noire', source: 'CHARACTER', sourceId: 'c1', priority: 100, createdAt: Date.now() }] },
      { kind: 'SCENE', content: 'robe rouge', order: 8, constraints: [{ id: 'c1', type: 'SCENE', target: 'clothing', value: 'robe rouge', source: 'scene', priority: 50, onConflict: 'LOCKED_WINS' }] }
    ]);
    return merged.conflicts.length > 0;
  });
  check('QueueEngine estimate', () => { const est = QueueEngine.estimateTime([{ type: 'IMAGE' }, { type: 'IMAGE' }, { type: 'VIDEO' }]); return est.minMs > 0 && est.maxMs > est.minMs; });
  console.log('[SelfTest]', results);
  const failures = results.filter(r => !r.ok);
  if (failures.length > 0) { console.warn('[SelfTest] Échecs :', failures); EventBus.emit('LOG', { category: 'SYSTEM', message: `⚠️ Self-test : ${failures.length}/${results.length} échec(s)` }); }
  else EventBus.emit('LOG', { category: 'SYSTEM', message: `✓ Self-test : ${results.length}/${results.length} OK` });
  return results;
}

async function init() {
  console.log('[Studio] Initialisation…');
  setupAntiRefresh();
  try { await StorageEngine.open(); console.log('[Studio] IndexedDB ouverte'); }
  catch (e) { console.error('[Studio] Erreur IndexedDB', e); Toast.show('Erreur base de données : ' + e.message, 'error', 6000); return; }
  const lastProjectId = localStorage.getItem(PLATFORM.lsKeys.lastProjectId);
  let projects = await ProjectEngine.listAll();
  if (projects.length === 0) {
    console.log('[Studio] Aucun projet, création du premier…');
    const first = await ProjectEngine.create({
      name: 'Mon premier projet',
      description: 'Projet créé automatiquement au démarrage',
      masterPrompt: 'Univers cinématographique premium, photographie réaliste, lumière naturelle douce, contraste élégant, peau naturelle, profondeur de champ.',
      globalStyle: 'Portrait 9:16 vertical, cinématographique, haute qualité'
    });
    projects = [first];
  }
  const targetProject = projects.find(p => p.id === lastProjectId) || projects[0];
  await AppState.setCurrentProject(targetProject.id);
  setupEventListeners();
  setupWakeLockButton();
  const wakeEnabled = localStorage.getItem(PLATFORM.lsKeys.wakeLock) === '1';
  if (wakeEnabled) await WakeLock.activate();
  await ProjectTabs.render();
  AppState.setCurrentView('home');
  await Router.render();
  await resumeQueueIfNeeded();
  EventBus.emit('LOG', { category: 'SYSTEM', message: '✦ Studio initialisé — ' + PLATFORM.version });
  EventBus.emit('LOG', { category: 'SYSTEM', message: `${projects.length} projet${projects.length > 1 ? 's' : ''} · Provider : Agnes` });
  if (!ApiClient.getKey()) setTimeout(() => Toast.show('Ajoutez votre clé API dans Profil', 'warn', 5000), 1500);
  console.log('[Studio] Prêt.');
}

window.Studio = { EventBus, StorageEngine, PromptEngine, CharacterEngine, EnvironmentEngine, ReferenceEngine, SceneEngine, ShotEngine, ProjectEngine, QueueEngine, ExportEngine, ProtocolEngine, ApiClient, AppState, Router, selfTest };

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', () => { selfTest().then(() => init()); });
} else {
  selfTest().then(() => init());
}

console.log('[Studio] Module prêt. Studio.selfTest() pour tester.');
</script>
