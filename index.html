<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a0a1e">
<title>Girly Studio ✨</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --rose: #ff6b9d; --rose-soft: #ff9ec4;
  --violet: #a855f7; --violet-soft: #c084fc;
  --gold: #fbbf24;
  --bg: #1a0a1e; --bg-2: #240e2a;
  --glass: rgba(255,255,255,0.07); --glass-border: rgba(255,255,255,0.12);
  --ink: #fce7f3; --ink-dim: #c4a0c4; --ink-faint: #9d7a9d;
  --success: #4ade80; --error: #f87171; --warn: #fbbf24;
  --radius: 20px; --radius-sm: 12px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
html, body { background: var(--bg); }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', Helvetica, Arial, sans-serif;
  background: radial-gradient(circle at 10% 0%, rgba(255,107,157,0.15) 0%, transparent 50%),
    radial-gradient(circle at 90% 20%, rgba(168,85,247,0.12) 0%, transparent 50%),
    radial-gradient(circle at 50% 100%, rgba(251,191,36,0.08) 0%, transparent 50%),
    var(--bg);
  background-attachment: fixed;
  color: var(--ink); min-height: 100vh;
  padding: calc(var(--safe-top) + 1rem) 1rem calc(var(--safe-bottom) + 7rem);
  font-size: 15px; line-height: 1.55;
  max-width: 720px; margin: 0 auto; overflow-x: hidden;
  overscroll-behavior-y: none;
}
.glass {
  background: var(--glass);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius); position: relative; z-index: 1; overflow: hidden;
}
.glass::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
}
header { text-align: center; margin-bottom: 1.2rem; position: relative; z-index: 1; }
.logo-mark {
  display: inline-flex; align-items: center; justify-content: center;
  width: 60px; height: 60px; border-radius: 20px;
  background: linear-gradient(135deg, var(--rose), var(--violet));
  font-size: 26px; margin-bottom: 0.5rem;
  box-shadow: 0 8px 32px rgba(255,107,157,0.35);
  animation: float 4s ease-in-out infinite;
}
@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
h1 {
  font-size: 1.7rem; font-weight: 700; letter-spacing: -0.03em;
  background: linear-gradient(135deg, var(--rose-soft), var(--gold), var(--violet-soft));
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}
.subtitle { font-size: 0.75rem; color: var(--ink-dim); }

.section { margin-bottom: 0.8rem; }
.section-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0.95rem 1.1rem; cursor: pointer; user-select: none;
}
.section-header:active { background: rgba(255,255,255,0.03); }
.section-title {
  font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.15em;
  font-weight: 700; color: var(--ink-dim); display: flex; align-items: center; gap: 0.5rem;
}
.badge {
  padding: 0.12rem 0.45rem; border-radius: 999px; font-size: 0.58rem;
  background: rgba(255,107,157,0.15); color: var(--rose-soft);
  border: 1px solid rgba(255,107,157,0.3); letter-spacing: 0.05em;
}
.badge.ok { background: rgba(74,222,128,0.12); color: var(--success); border-color: rgba(74,222,128,0.3); }
.chevron { font-size: 0.65rem; color: var(--ink-faint); transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1); }
.section.open .chevron { transform: rotate(180deg); }
.section-body { max-height: 0; overflow: hidden; transition: max-height 0.45s cubic-bezier(0.4,0,0.2,1); }
.section.open .section-body { max-height: 8000px; }
.section-content { padding: 0 1.1rem 1.1rem; }

input, textarea, select {
  width: 100%; padding: 0.85rem 1rem; border-radius: var(--radius-sm);
  border: 1px solid var(--glass-border); background: rgba(0,0,0,0.25);
  color: var(--ink); font-family: inherit; font-size: 0.85rem;
  transition: border-color 0.2s, box-shadow 0.2s;
}
input:focus, textarea:focus, select:focus {
  outline: none; border-color: var(--violet); box-shadow: 0 0 0 3px rgba(168,85,247,0.15);
}
textarea { min-height: 80px; line-height: 1.5; resize: vertical; }
select { -webkit-appearance: none; appearance: none; cursor: pointer;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='%23ff9ec4' d='M0 0l5 6 5-6z'/></svg>");
  background-repeat: no-repeat; background-position: right 1rem center; padding-right: 2.5rem;
}
select option { background: var(--bg-2); color: var(--ink); }

.api-input { font-family: ui-monospace, monospace; font-size: 0.78rem; margin-bottom: 0.5rem; }
.btn-save, .btn-primary {
  width: 100%; padding: 0.9rem; border-radius: var(--radius-sm); border: none;
  cursor: pointer; font-family: inherit; font-size: 0.85rem; font-weight: 700;
  letter-spacing: 0.06em; color: #fff;
  background: linear-gradient(135deg, var(--rose), var(--violet));
  box-shadow: 0 4px 20px rgba(255,107,157,0.3);
  transition: transform 0.15s, box-shadow 0.15s;
}
.btn-save:active, .btn-primary:active:not(:disabled) { transform: scale(0.97); }
.btn-primary { padding: 1.1rem; font-size: 1rem; margin-bottom: 0.6rem; }
.btn-primary:disabled { opacity: 0.35; cursor: not-allowed; box-shadow: none; }
.btn-stop {
  width: 100%; padding: 0.8rem; border-radius: var(--radius);
  border: 1px solid rgba(248,113,113,0.4); background: rgba(248,113,113,0.08);
  color: var(--error); font-family: inherit; font-size: 0.8rem; font-weight: 700;
  cursor: pointer; display: none; margin-bottom: 0.6rem; letter-spacing: 0.08em;
}
.btn-stop.visible { display: block; }

.api-status {
  display: flex; align-items: center; gap: 0.5rem; font-size: 0.7rem;
  color: var(--ink-dim); padding: 0.5rem 0.7rem; margin-top: 0.5rem;
  background: rgba(0,0,0,0.2); border-radius: var(--radius-sm);
}
.status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-faint); flex-shrink: 0; }
.api-status.ok .status-dot { background: var(--success); box-shadow: 0 0 8px var(--success); }

.agent-box {
  background: linear-gradient(135deg, rgba(168,85,247,0.1), rgba(255,107,157,0.08));
  border: 1px solid rgba(168,85,247,0.25); border-radius: var(--radius);
  padding: 1rem; margin-bottom: 0.8rem; position: relative; z-index: 1;
}
.agent-header { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.6rem; }
.agent-avatar {
  width: 34px; height: 34px; border-radius: 11px;
  background: linear-gradient(135deg, var(--violet), var(--rose));
  display: flex; align-items: center; justify-content: center; font-size: 17px;
}
.agent-name { font-size: 0.8rem; font-weight: 700; }
.agent-desc { font-size: 0.65rem; color: var(--ink-dim); }
.agent-toggle { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.5rem; font-size: 0.7rem; color: var(--ink-dim); cursor: pointer; }
.toggle-switch { width: 38px; height: 20px; border-radius: 10px; background: rgba(255,255,255,0.1); position: relative; transition: background 0.3s; flex-shrink: 0; }
.toggle-switch.on { background: linear-gradient(135deg, var(--rose), var(--violet)); }
.toggle-knob { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1); }
.toggle-switch.on .toggle-knob { transform: translateX(18px); }

.styles-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(95px, 1fr)); gap: 0.5rem; }
.style-card {
  padding: 0.75rem 0.4rem; border-radius: var(--radius-sm);
  border: 1px solid var(--glass-border); background: rgba(0,0,0,0.2);
  cursor: pointer; text-align: center; transition: all 0.2s cubic-bezier(0.34,1.56,0.64,1);
}
.style-card:active { transform: scale(0.95); }
.style-card.selected { background: linear-gradient(135deg, rgba(255,107,157,0.25), rgba(168,85,247,0.2)); border-color: var(--rose); }
.style-card .emoji { font-size: 1.4rem; display: block; margin-bottom: 0.25rem; }
.style-card .name { font-size: 0.65rem; font-weight: 600; line-height: 1.2; }

.char-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(85px, 1fr)); gap: 0.5rem; max-height: 300px; overflow-y: auto; }
.char-card {
  position: relative; border-radius: var(--radius-sm); overflow: hidden;
  border: 1px solid var(--glass-border); aspect-ratio: 3/4; cursor: pointer;
}
.char-card.selected { border-color: var(--gold); box-shadow: 0 0 16px rgba(251,191,36,0.3); }
.char-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
.char-card .char-name {
  position: absolute; bottom: 0; left: 0; right: 0; padding: 0.35rem 0.4rem;
  font-size: 0.58rem; font-weight: 600;
  background: linear-gradient(transparent, rgba(10,10,18,0.95));
  text-overflow: ellipsis; white-space: nowrap; overflow: hidden;
}
.char-card .char-remove {
  position: absolute; top: 3px; right: 3px; width: 20px; height: 20px;
  border-radius: 50%; background: rgba(248,113,113,0.9); color: #fff;
  border: none; font-size: 10px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}

.prompt-card {
  background: rgba(0,0,0,0.15); border-radius: var(--radius-sm);
  padding: 0.9rem; margin-bottom: 0.6rem; border: 1px solid var(--glass-border);
}
.pc-header { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.6rem; }
.pc-num {
  width: 24px; height: 24px; border-radius: 7px;
  background: linear-gradient(135deg, var(--rose), var(--violet));
  display: flex; align-items: center; justify-content: center;
  font-size: 0.68rem; font-weight: 700; flex-shrink: 0;
}
.pc-title { font-size: 0.75rem; font-weight: 600; flex: 1; }
.pc-type {
  padding: 0.12rem 0.45rem; border-radius: 999px; font-size: 0.55rem;
  font-weight: 700; background: rgba(168,85,247,0.15);
  color: var(--violet-soft); border: 1px solid rgba(168,85,247,0.3);
}
.pc-type.video { background: rgba(255,107,157,0.15); color: var(--rose-soft); border-color: rgba(255,107,157,0.3); }
.prompt-card textarea { min-height: 55px; font-size: 0.78rem; margin-bottom: 0.4rem; }
.pc-preview {
  border-radius: var(--radius-sm); overflow: hidden; background: #000;
  aspect-ratio: 9/16; max-width: 110px; margin: 0.4rem auto;
  border: 1px solid var(--glass-border);
}
.pc-preview img, .pc-preview video { width: 100%; height: 100%; object-fit: cover; display: block; }
.pc-status { font-size: 0.62rem; color: var(--ink-dim); display: flex; align-items: center; gap: 0.4rem; margin-top: 0.3rem; }
.pc-status .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--ink-faint); flex-shrink: 0; }
.pc-status.creating .dot { background: var(--warn); animation: pulse 1s infinite; }
.pc-status.done .dot { background: var(--success); }
.pc-status.failed .dot { background: var(--error); }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
.pc-actions { display: flex; gap: 0.4rem; margin-top: 0.5rem; }
.pc-actions button {
  flex: 1; padding: 0.5rem; border-radius: 8px;
  border: 1px solid var(--glass-border); background: rgba(0,0,0,0.2);
  color: var(--ink-dim); font-size: 0.65rem; font-weight: 600;
  cursor: pointer; font-family: inherit;
}
.pc-actions button:active { background: rgba(255,255,255,0.05); }
.pc-actions button.dl {
  background: linear-gradient(135deg, rgba(74,222,128,0.15), rgba(74,222,128,0.05));
  border-color: rgba(74,222,128,0.3); color: var(--success);
}

.progress-bar { height: 4px; background: rgba(255,255,255,0.08); border-radius: 2px; overflow: hidden; margin: 0.6rem 0; }
.progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--rose), var(--violet), var(--gold)); border-radius: 2px; transition: width 0.4s ease; }

.status-bar {
  position: fixed; bottom: 0; left: 0; right: 0;
  padding: 0.8rem 1.1rem calc(var(--safe-bottom) + 0.8rem);
  background: rgba(26,10,30,0.92); backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--glass-border);
  font-size: 0.75rem; display: flex; align-items: center; gap: 0.5rem;
  transform: translateY(100%); transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
  z-index: 100;
}
.status-bar.visible { transform: translateY(0); }
.spinner { width: 13px; height: 13px; border: 2px solid rgba(255,107,157,0.2); border-top-color: var(--rose); border-radius: 50%; animation: spin 0.8s linear infinite; flex-shrink: 0; }
@keyframes spin { to { transform: rotate(360deg); } }

.toast {
  position: fixed; top: calc(var(--safe-top) + 1rem); left: 50%;
  transform: translateX(-50%) translateY(-120px);
  padding: 0.75rem 1.1rem; border-radius: var(--radius-sm);
  background: rgba(26,10,30,0.95); backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border); font-size: 0.78rem; z-index: 1000;
  display: flex; align-items: center; gap: 0.5rem; opacity: 0;
  transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s;
  max-width: 90vw;
}
.toast.visible { transform: translateX(-50%) translateY(0); opacity: 1; }
.toast.success { border-color: rgba(74,222,128,0.4); }
.toast.error { border-color: rgba(248,113,113,0.4); }

.debug-panel {
  position: fixed; bottom: 0; left: 0; right: 0; height: 180px;
  background: rgba(10,5,12,0.97); backdrop-filter: blur(20px);
  border-top: 2px solid var(--violet); z-index: 200;
  display: flex; flex-direction: column; font-family: ui-monospace, monospace;
  transition: height 0.3s ease;
}
.debug-panel.collapsed { height: 30px; }
.debug-header { display: flex; justify-content: space-between; align-items: center; padding: 0.35rem 0.7rem; cursor: pointer; user-select: none; border-bottom: 1px solid var(--glass-border); flex-shrink: 0; }
.debug-title { font-size: 0.6rem; color: var(--violet-soft); letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; }
.debug-actions button { background: transparent; border: 1px solid var(--glass-border); color: var(--ink-dim); font-size: 0.55rem; padding: 0.15rem 0.4rem; border-radius: 4px; cursor: pointer; margin-left: 0.25rem; }
.debug-body { flex: 1; overflow-y: auto; padding: 0.35rem 0.5rem; font-size: 0.6rem; line-height: 1.5; }
.debug-entry { padding: 0.1rem 0; border-left: 2px solid transparent; padding-left: 0.35rem; word-break: break-word; }
.debug-entry.info { border-left-color: var(--ink-faint); color: #a0a0b0; }
.debug-entry.success { border-left-color: var(--success); color: #86efac; }
.debug-entry.error { border-left-color: var(--error); color: #fca5a5; }
.debug-entry.api { border-left-color: var(--violet); color: #c4b5fd; }

.hidden { display: none !important; }
#noSleepCanvas { position: fixed; top: 0; left: 0; width: 1px; height: 1px; opacity: 0.01; pointer-events: none; z-index: -1; }
</style>
</head>
<body>

<header>
  <div class="logo-mark">✨</div>
  <h1>Girly Studio</h1>
  <p class="subtitle">Créez. Rêvez. Générez.</p>
</header>

<!-- API -->
<div class="section glass open" id="sec-api">
  <div class="section-header" data-toggle="sec-api">
    <span class="section-title">🔑 Clé API <span class="badge" id="api-badge">requise</span></span>
    <span class="chevron">▼</span>
  </div>
  <div class="section-body"><div class="section-content">
    <input type="password" class="api-input" id="api-input" placeholder="sk-..." autocomplete="off" spellcheck="false">
    <button class="btn-save" id="btn-save-api">Enregistrer ✨</button>
    <div class="api-status" id="api-status"><span class="status-dot"></span><span id="api-status-text">Aucune clé</span></div>
  </div></div>
</div>

<!-- Agent -->
<div class="agent-box">
  <div class="agent-header">
    <div class="agent-avatar">🤖</div>
    <div><div class="agent-name">Agnes Agent</div><div class="agent-desc">Analyse votre prompt et structure le scénario</div></div>
  </div>
  <div class="agent-toggle" id="agent-toggle">
    <div class="toggle-switch" id="agent-switch"><div class="toggle-knob"></div></div>
    <span>Activer l'agent créatif</span>
  </div>
</div>

<!-- Prompt principal -->
<div class="section glass open" id="sec-main">
  <div class="section-header" data-toggle="sec-main">
    <span class="section-title">💭 Votre vision</span>
    <span class="chevron">▼</span>
  </div>
  <div class="section-body"><div class="section-content">
    <textarea id="main-prompt" placeholder="Décrivez ce que vous voulez créer..."></textarea>
    <div style="margin-top:0.6rem;">
      <label style="font-size:0.68rem;color:var(--ink-dim);text-transform:uppercase;letter-spacing:0.1em;font-weight:700;">Type</label>
      <select id="gen-type" style="margin-top:0.35rem;">
        <option value="image">🖼️ Images uniquement</option>
        <option value="video" selected>🎬 Images + Vidéos</option>
        <option value="text-video">📝 Texte → Vidéo direct</option>
      </select>
    </div>
    <div style="margin-top:0.6rem;">
      <label style="font-size:0.68rem;color:var(--ink-dim);text-transform:uppercase;letter-spacing:0.1em;font-weight:700;">Nombre de scènes</label>
      <select id="scene-count" style="margin-top:0.35rem;">
        <option value="3">3 scènes</option>
        <option value="5" selected>5 scènes</option>
        <option value="8">8 scènes</option>
        <option value="10">10 scènes</option>
        <option value="15">15 scènes</option>
        <option value="20">20 scènes</option>
      </select>
    </div>
    <div style="margin-top:0.6rem;">
      <label style="font-size:0.68rem;color:var(--ink-dim);text-transform:uppercase;letter-spacing:0.1em;font-weight:700;">Durée vidéo</label>
      <select id="video-duration" style="margin-top:0.35rem;">
        <option value="5">5 secondes</option>
        <option value="7" selected>7 secondes</option>
        <option value="10">10 secondes</option>
        <option value="12">12 secondes</option>
      </select>
    </div>
  </div></div>
</div>

<!-- Style -->
<div class="section glass" id="sec-style">
  <div class="section-header" data-toggle="sec-style">
    <span class="section-title">🎨 Style visuel</span>
    <span class="chevron">▼</span>
  </div>
  <div class="section-body"><div class="section-content">
    <div class="styles-grid" id="styles-grid"></div>
  </div></div>
</div>

<!-- Personnages -->
<div class="section glass" id="sec-chars">
  <div class="section-header" data-toggle="sec-chars">
    <span class="section-title">👥 Personnages <span class="badge" id="char-badge">0</span></span>
    <span class="chevron">▼</span>
  </div>
  <div class="section-body"><div class="section-content">
    <div style="display:flex;gap:0.4rem;margin-bottom:0.6rem;">
      <button class="btn-save" id="btn-add-char" style="flex:1;">＋ Ajouter</button>
      <button class="btn-save" id="btn-clear-chars" style="flex:1;background:rgba(248,113,113,0.15);color:var(--error);box-shadow:none;">✕ Effacer</button>
    </div>
    <div class="char-grid" id="char-grid">
      <div style="grid-column:1/-1;text-align:center;color:var(--ink-faint);font-size:0.7rem;padding:0.8rem;">Aucun personnage</div>
    </div>
    <input type="file" id="char-file-input" accept="image/*" style="display:none">
  </div></div>
</div>

<button class="btn-primary" id="btn-generate" disabled>✨ Générer</button>
<button class="btn-stop" id="btn-stop">⏹ Arrêter</button>

<!-- Scènes -->
<div class="section glass hidden" id="sec-prompts">
  <div class="section-header" data-toggle="sec-prompts">
    <span class="section-title">📝 Scènes <span class="badge ok" id="prompt-count">0</span></span>
    <span class="chevron">▼</span>
  </div>
  <div class="section-body"><div class="section-content">
    <div id="prompts-container"></div>
  </div></div>
</div>

<div class="progress-bar hidden" id="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>

<div class="status-bar" id="status-bar"><div class="spinner"></div><span id="status-text">Prêt</span></div>
<div class="toast" id="toast"><span>✓</span><span id="toast-text"></span></div>

<div class="debug-panel collapsed" id="debug-panel">
  <div class="debug-header" id="debug-header">
    <span class="debug-title">🖥️ Console</span>
    <div class="debug-actions">
      <button type="button" id="debug-clear">Effacer</button>
      <button type="button" id="debug-collapse">+</button>
    </div>
  </div>
  <div class="debug-body" id="debug-body"></div>
</div>

<canvas id="noSleepCanvas" width="2" height="2"></canvas>
<video id="noSleepVideo" playsinline muted loop style="display:none"></video>

<script>
// ═══════════════════════════════════════════════════════════════════
// CONFIG — 基于搜索结果 [citation:2] 和 [citation:5]
// ═══════════════════════════════════════════════════════════════════
const API_BASE = 'https://apihub.agnes-ai.com/v1';
const POLL_BASE = 'https://apihub.agnes-ai.com/agnesapi';
const MODEL_TEXT = 'agnes-2.5-flash';
const MODEL_IMAGE = 'agnes-image-2.1-flash';
const MODEL_VIDEO = 'agnes-video-v2.0';
const FRAME_RATE = 24;
const VIDEO_RPM_SAFE_MS = 70000;
const IMAGE_PARALLEL = 3;
const IMAGE_INTERVAL_MS = 3400;
const VIDEO_FIRST_POLL = 80;
const POLL_INTERVALS = [8, 8, 12, 12, 20, 20, 25];
const MAX_POLL = 100;
const API_KEY_STORAGE = 'girly_api_key';
const CHAR_STORAGE = 'girly_chars';

const STYLES = [
  { id: 'cinematic', name: 'Réaliste Cinématique', emoji: '🎬', prompt: 'cinematic film look, dramatic lighting, shallow depth of field, photorealistic, 35mm film grain' },
  { id: 'anime', name: 'Manga Animé', emoji: '🌸', prompt: 'Japanese anime style, cel shading, expressive eyes, vibrant colors, Studio Ghibli influence' },
  { id: 'whiteboard', name: 'Whiteboard', emoji: '📝', prompt: 'whiteboard animation style, hand-drawn sketches on white background, simple black outlines' },
  { id: 'painting', name: 'Peinture', emoji: '🎨', prompt: 'oil painting style, visible brushstrokes, rich textured paint, classical art technique' },
  { id: 'documentary', name: 'Documentaire', emoji: '📹', prompt: 'documentary photography style, natural lighting, candid framing, 35mm film' },
  { id: 'pedago', name: 'Pédagogue', emoji: '📚', prompt: 'educational illustration style, clear diagrams, friendly design, bright colors, infographic' },
  { id: 'historical', name: 'Historique', emoji: '🏛️', prompt: 'historical film aesthetic, period-accurate costumes and sets, warm aged tones, dusty atmosphere' }
];

const state = {
  apiKey: '', characters: [], selectedChars: new Set(),
  selectedStyle: STYLES[0], genType: 'video', sceneCount: 5, videoDuration: 7,
  agentEnabled: false, scenes: [], isRunning: false, stopRequested: false
};

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg, type='success') {
  $('toast-text').textContent = msg;
  $('toast').className = 'toast ' + type;
  requestAnimationFrame(() => $('toast').classList.add('visible'));
  setTimeout(() => $('toast').classList.remove('visible'), 2500);
}

function debugLog(msg, type='info') {
  const body = $('debug-body');
  const time = new Date().toLocaleTimeString('fr-FR', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const el = document.createElement('div');
  el.className = 'debug-entry ' + type;
  el.textContent = '[' + time + '] ' + msg;
  body.appendChild(el);
  body.scrollTop = body.scrollHeight;
  while (body.children.length > 150) body.removeChild(body.firstChild);
}

function setStatus(text) {
  if (text) { $('status-bar').classList.add('visible'); $('status-text').textContent = text; }
  else $('status-bar').classList.remove('visible');
}

// API KEY
function loadApiKey() { try { return localStorage.getItem(API_KEY_STORAGE) || ''; } catch(e) { return ''; } }
function saveApiKey() {
  const key = $('api-input').value.trim();
  state.apiKey = key;
  if (key) localStorage.setItem(API_KEY_STORAGE, key); else localStorage.removeItem(API_KEY_STORAGE);
  updateApiUI();
}
function updateApiUI() {
  if (state.apiKey) {
    $('api-status').classList.add('ok');
    $('api-status-text').textContent = '✓ ' + state.apiKey.slice(0,8) + '…' + state.apiKey.slice(-4);
    $('api-badge').textContent = 'active'; $('api-badge').className = 'badge ok';
    $('api-input').value = state.apiKey;
  } else {
    $('api-status').classList.remove('ok');
    $('api-status-text').textContent = 'Aucune clé';
    $('api-badge').textContent = 'requise'; $('api-badge').className = 'badge';
  }
  updateGenerateBtn();
}

// CHARACTERS
function loadChars() { try { return JSON.parse(localStorage.getItem(CHAR_STORAGE) || '[]'); } catch(e) { return []; } }
function saveChars(c) { localStorage.setItem(CHAR_STORAGE, JSON.stringify(c.slice(-30))); }
function renderChars() {
  const grid = $('char-grid');
  if (!state.characters.length) {
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--ink-faint);font-size:0.7rem;padding:0.8rem;">Aucun personnage</div>';
    $('char-badge').textContent = '0'; return;
  }
  grid.innerHTML = state.characters.map(c =>
    '<div class="char-card ' + (state.selectedChars.has(c.id) ? 'selected' : '') + '" data-id="' + c.id + '">' +
      '<img src="' + c.imageData + '">' +
      '<div class="char-name">' + esc(c.name) + '</div>' +
      '<button class="char-remove" data-remove="' + c.id + '">✕</button>' +
    '</div>'
  ).join('');
  $('char-badge').textContent = state.characters.length;
  grid.querySelectorAll('.char-card').forEach(el => {
    el.addEventListener('click', (e) => {
      if (e.target.classList.contains('char-remove')) return;
      const id = parseInt(el.dataset.id);
      if (state.selectedChars.has(id)) state.selectedChars.delete(id); else state.selectedChars.add(id);
      renderChars();
    });
  });
  grid.querySelectorAll('[data-remove]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = parseInt(btn.dataset.remove);
      state.characters = state.characters.filter(c => c.id !== id);
      state.selectedChars.delete(id);
      saveChars(state.characters); renderChars();
    });
  });
}

// API FETCH
async function apiFetch(url, options, label) {
  for (let i = 0; i < 7; i++) {
    if (state.stopRequested) throw new Error('Arrêt');
    try {
      const res = await fetch(url, options);
      if (res.status === 429) { const w = [10,20,35,50,75,100,150][Math.min(i,6)]; debugLog('429 — '+w+'s', 'error'); await sleep(w*1000); continue; }
      if (res.status === 503) { const w = [5,10,15,20,30,45][Math.min(i,5)]; debugLog('503 — '+w+'s', 'error'); await sleep(w*1000); continue; }
      return res;
    } catch(e) {
      if (e.message === 'Arrêt') throw e;
      await sleep(5000);
    }
  }
  return fetch(url, options);
}

// AGENT
async function runAgent(userPrompt) {
  debugLog('Agent: analyse…', 'api');
  const body = {
    model: MODEL_TEXT,
    messages: [
      { role: 'system', content: 'Tu es un directeur créatif. Retourne UNIQUEMENT un JSON valide: {"title":"...","scenes":[{"number":1,"imagePrompt":"...","actionPrompt":"..."}]}. imagePrompt décrit UNE image. actionPrompt décrit le mouvement vidéo en anglais.' },
      { role: 'user', content: 'Crée ' + state.sceneCount + ' scènes pour: ' + userPrompt + '\nStyle: ' + state.selectedStyle.prompt }
    ],
    temperature: 0.8, max_tokens: 4000, response_format: { type: 'json_object' }
  };
  const res = await apiFetch(API_BASE + '/chat/completions', {
    method: 'POST', headers: { 'Authorization': 'Bearer ' + state.apiKey, 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  }, 'Agent');
  if (!res.ok) throw new Error('Agent HTTP ' + res.status);
  const data = await res.json();
  return parseJson(data.choices?.[0]?.message?.content);
}

function parseJson(text) {
  if (!text) return null;
  let c = text.trim();
  const fm = c.match(/```(?:json)?\s*([\s\S]*?)```/);
  if (fm) c = fm[1].trim();
  const fb = c.indexOf('{');
  if (fb >= 0) c = c.slice(fb);
  try { return JSON.parse(c); } catch(e) {}
  try { return JSON.parse(c.replace(/[\n\r\t]/g, ' ')); } catch(e) {}
  return null;
}

// IMAGE
async function generateImage(prompt) {
  const res = await apiFetch(API_BASE + '/images/generations', {
    method: 'POST', headers: { 'Authorization': 'Bearer ' + state.apiKey, 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: MODEL_IMAGE,
      prompt: prompt + '. ' + state.selectedStyle.prompt + '. Portrait 9:16 vertical.',
      n: 1, size: '1024x1792', response_format: 'url'
    })
  }, 'Image');
  if (!res.ok) throw new Error('Image HTTP ' + res.status);
  const data = await res.json();
  return data.data?.[0]?.url || data.data?.[0]?.b64_json;
}

// VIDEO — 基于搜索结果 [citation:2] 使用 image 字段 + num_frames
async function createVideo(imageUrl, prompt, durationSec) {
  const numFrames = Math.min(441, Math.floor(durationSec * 24 / 8) * 8 + 1);
  const body = {
    model: MODEL_VIDEO,
    prompt: prompt + '. Portrait 9:16 vertical, 24fps, no text.',
    num_frames: numFrames,
    frame_rate: 24
  };
  if (imageUrl) body.image = imageUrl;
  const res = await apiFetch(API_BASE + '/videos', {
    method: 'POST', headers: { 'Authorization': 'Bearer ' + state.apiKey, 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  }, 'Video');
  if (!res.ok) throw new Error('Video HTTP ' + res.status);
  const data = await res.json();
  return data.video_id || data.id || data.task_id;
}

async function pollVideo(videoId, onProgress) {
  let rem = VIDEO_FIRST_POLL;
  while (rem > 0) { if (state.stopRequested) throw new Error('Arrêt'); onProgress('Préparation… ' + rem + 's'); await sleep(1000); rem--; }
  for (let i = 0; i < MAX_POLL; i++) {
    if (state.stopRequested) throw new Error('Arrêt');
    if (i > 0) { const w = POLL_INTERVALS[Math.min(i-1, POLL_INTERVALS.length-1)]; let r = w;
      while (r > 0) { if (state.stopRequested) throw new Error('Arrêt'); onProgress('En cours… ' + r + 's'); await sleep(1000); r--; } }
    const res = await apiFetch(POLL_BASE + '?video_id=' + encodeURIComponent(videoId) + '&model_name=' + MODEL_VIDEO, {
      headers: { 'Authorization': 'Bearer ' + state.apiKey }
    }, 'Poll');
    const d = await res.json();
    const st = d.status || 'unknown';
    onProgress('Création… ' + (d.progress || 0) + '%');
    if (st === 'completed' || st === 'succeeded' || st === 'done') return (d.metadata?.url) || d.url || (d.output?.url);
    if (st === 'failed' || st === 'error') throw new Error('Échec vidéo');
  }
  throw new Error('Timeout');
}

// PIPELINE
async function startGeneration() {
  if (state.isRunning) return;
  if (!state.apiKey) { toast('Ajoutez la clé API', 'error'); return; }
  const mainPrompt = $('main-prompt').value.trim();
  if (!mainPrompt) { toast('Décrivez votre vision', 'error'); return; }

  state.isRunning = true; state.stopRequested = false; state.scenes = [];
  $('btn-stop').classList.add('visible'); $('btn-generate').disabled = true;
  $('progress-bar').classList.remove('hidden');
  $('sec-prompts').classList.remove('hidden'); $('sec-prompts').classList.add('open');
  $('prompts-container').innerHTML = '';

  debugLog('=== DÉMARRAGE ===', 'success');
  debugLog('Type: ' + state.genType, 'info');
  debugLog('Style: ' + state.selectedStyle.name, 'info');

  try {
    // Phase 1: Agent ou fallback
    setStatus('Agent analyse…');
    let scenario;
    if (state.agentEnabled) {
      scenario = await runAgent(mainPrompt);
      if (!scenario?.scenes) throw new Error('Agent: pas de scènes');
    } else {
      scenario = { title: 'Création', scenes: [] };
      for (let i = 0; i < state.sceneCount; i++) {
        scenario.scenes.push({
          number: i + 1,
          imagePrompt: mainPrompt + ' — scène ' + (i+1),
          actionPrompt: mainPrompt + ' — mouvement ' + (i+1)
        });
      }
    }

    state.scenes = scenario.scenes.map((s, i) => ({
      id: i, number: s.number || i+1,
      imagePrompt: s.imagePrompt, actionPrompt: s.actionPrompt,
      imageUrl: null, videoUrl: null, status: 'pending', videoStatus: 'pending'
    }));
    renderPrompts();
    $('prompt-count').textContent = state.scenes.length;

    // Phase 2: Images (sauf text-video pur)
    if (state.genType !== 'text-video') {
      setStatus('Génération des images…');
      debugLog('Images: ' + state.scenes.length + ' x' + IMAGE_PARALLEL, 'info');
      let batch = [];
      for (const s of state.scenes) {
        batch.push(generateSceneImage(s));
        if (batch.length >= IMAGE_PARALLEL) { await Promise.all(batch); batch = []; await sleep(IMAGE_INTERVAL_MS); }
      }
      await Promise.all(batch);
      const ok = state.scenes.filter(s => s.imageUrl).length;
      debugLog('Images: ' + ok + '/' + state.scenes.length, ok === state.scenes.length ? 'success' : 'error');
    }

    // Phase 3: Vidéos
    if (state.genType === 'video' || state.genType === 'text-video') {
      setStatus('Génération des vidéos…');
      debugLog('Vidéos: 1 par ' + (VIDEO_RPM_SAFE_MS/1000) + 's', 'info');
      const tasks = [];
      for (let i = 0; i < state.scenes.length; i++) {
        const s = state.scenes[i];
        if (state.genType === 'video' && !s.imageUrl) continue;
        tasks.push(generateSceneVideo(s));
        if (i < state.scenes.length - 1) {
          let r = Math.ceil(VIDEO_RPM_SAFE_MS / 1000);
          while (r > 0) { if (state.stopRequested) break; setStatus('Prochaine vidéo dans ' + r + 's…'); await sleep(1000); r--; }
        }
      }
      await Promise.allSettled(tasks);
    }

    const imgOk = state.scenes.filter(s => s.imageUrl).length;
    const vidOk = state.scenes.filter(s => s.videoUrl).length;
    debugLog('Terminé: ' + imgOk + ' img, ' + vidOk + ' vid', 'success');
    toast('✨ ' + imgOk + ' images, ' + vidOk + ' vidéos');
    $('progress-fill').style.width = '100%';

  } catch(e) {
    debugLog('Erreur: ' + e.message, 'error');
    toast('Erreur: ' + e.message.slice(0, 50), 'error');
  }

  state.isRunning = false; state.stopRequested = false;
  $('btn-stop').classList.remove('visible'); $('btn-generate').disabled = false;
  setStatus(null);
}

async function generateSceneImage(scene) {
  scene.status = 'creating'; renderPrompts();
  try {
    const url = await generateImage(scene.imagePrompt);
    scene.imageUrl = url; scene.status = 'done';
    debugLog('Image ' + scene.number + ' OK', 'success');
  } catch(e) { scene.status = 'failed'; debugLog('Image ' + scene.number + ': ' + e.message, 'error'); }
  renderPrompts();
}

async function generateSceneVideo(scene) {
  scene.videoStatus = 'creating'; renderPrompts();
  try {
    const vid = await createVideo(scene.imageUrl, scene.actionPrompt, state.videoDuration);
    debugLog('Vidéo ' + scene.number + ': ' + vid, 'info');
    const url = await pollVideo(vid, (p) => { scene.videoProgress = p; renderPrompts(); });
    scene.videoUrl = url; scene.videoStatus = 'done';
    debugLog('Vidéo ' + scene.number + ' OK', 'success');
  } catch(e) { scene.videoStatus = 'failed'; debugLog('Vidéo ' + scene.number + ': ' + e.message, 'error'); }
  renderPrompts();
}

// RENDER
function renderPrompts() {
  const container = $('prompts-container');
  if (!state.scenes.length) { container.innerHTML = ''; return; }
  container.innerHTML = state.scenes.map(s => {
    let st = '';
    if (s.status === 'pending') st = '<div class="pc-status"><span class="dot"></span>En attente</div>';
    else if (s.status === 'creating') st = '<div class="pc-status creating"><span class="dot"></span>Création…</div>';
    else if (s.status === 'done') st = '<div class="pc-status done"><span class="dot"></span>Image prête</div>';
    else st = '<div class="pc-status failed"><span class="dot"></span>Échec</div>';

    let vt = '';
    if (state.genType !== 'image') {
      if (s.videoStatus === 'done') vt = '<div class="pc-status done"><span class="dot"></span>Vidéo prête</div>';
      else if (s.videoStatus === 'creating') vt = '<div class="pc-status creating"><span class="dot"></span>' + (s.videoProgress || 'Vidéo…') + '</div>';
      else if (s.videoStatus === 'failed') vt = '<div class="pc-status failed"><span class="dot"></span>Échec vidéo</div>';
    }

    let media = '';
    if (s.videoUrl) media = '<div class="pc-preview"><video src="' + s.videoUrl + '" controls playsinline muted></video></div>';
    else if (s.imageUrl) media = '<div class="pc-preview"><img src="' + s.imageUrl + '"></div>';

    const dlImg = s.imageUrl ? '<button class="dl" data-dl="img" data-id="' + s.id + '">⬇ Image</button>' : '';
    const dlVid = s.videoUrl ? '<button class="dl" data-dl="vid" data-id="' + s.id + '">⬇ Vidéo</button>' : '';

    return '<div class="prompt-card" data-scene="' + s.id + '">' +
      '<div class="pc-header"><div class="pc-num">' + s.number + '</div><div class="pc-title">Scène ' + s.number + '</div>' +
      '<span class="pc-type' + (state.genType !== 'image' ? ' video' : '') + '">' + (state.genType !== 'image' ? '🎬' : '🖼️') + '</span></div>' +
      '<textarea data-prompt="image" data-id="' + s.id + '">' + esc(s.imagePrompt) + '</textarea>' +
      (state.genType !== 'image' ? '<textarea data-prompt="action" data-id="' + s.id + '">' + esc(s.actionPrompt) + '</textarea>' : '') +
      st + vt + media +
      (dlImg || dlVid ? '<div class="pc-actions">' + dlImg + dlVid + '</div>' : '') +
    '</div>';
  }).join('');

  container.querySelectorAll('textarea[data-prompt]').forEach(ta => {
    ta.addEventListener('input', (e) => {
      const id = parseInt(e.target.dataset.id);
      const field = e.target.dataset.prompt;
      const scene = state.scenes.find(s => s.id === id);
      if (scene) scene[field === 'image' ? 'imagePrompt' : 'actionPrompt'] = e.target.value;
    });
  });
  container.querySelectorAll('[data-dl]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = parseInt(btn.dataset.id);
      const scene = state.scenes.find(s => s.id === id);
      if (!scene) return;
      const url = btn.dataset.dl === 'img' ? scene.imageUrl : scene.videoUrl;
      const ext = btn.dataset.dl === 'img' ? 'png' : 'mp4';
      if (url) downloadFile(url, 'scene_' + scene.number + '.' + ext);
    });
  });
}

async function downloadFile(url, filename) {
  try {
    const res = await fetch(url);
    const blob = await res.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = filename; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  } catch(e) { toast('Téléchargement échoué', 'error'); }
}

function updateGenerateBtn() {
  const hasKey = !!state.apiKey;
  const hasPrompt = $('main-prompt').value.trim().length > 0;
  $('btn-generate').disabled = !hasKey || !hasPrompt || state.isRunning;
  $('btn-generate').textContent = state.isRunning ? 'Génération…' :
    (!hasKey ? '🔑 Ajoutez la clé' : (!hasPrompt ? '💭 Décrivez votre vision' : '✨ Générer'));
}

// INIT
(function init() {
  state.apiKey = loadApiKey(); updateApiUI();
  $('btn-save-api').addEventListener('click', () => { saveApiKey(); toast('Clé enregistrée ✨'); });
  $('api-input').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); saveApiKey(); } });

  state.characters = loadChars(); renderChars();
  $('btn-add-char').addEventListener('click', () => $('char-file-input').click());
  $('char-file-input').addEventListener('change', (e) => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = (ev) => {
      const name = prompt('Nom:', 'Personnage ' + (state.characters.length + 1));
      if (name) {
        state.characters.push({ id: Date.now(), name, imageData: ev.target.result });
        saveChars(state.characters); renderChars(); toast('Personnage ajouté ✨');
      }
    };
    r.readAsDataURL(f); e.target.value = '';
  });
  $('btn-clear-chars').addEventListener('click', () => {
    if (confirm('Effacer tous les personnages ?')) {
      state.characters = []; state.selectedChars.clear();
      saveChars([]); renderChars();
    }
  });

  $('styles-grid').innerHTML = STYLES.map(s =>
    '<div class="style-card ' + (state.selectedStyle.id === s.id ? 'selected' : '') + '" data-style="' + s.id + '">' +
    '<span class="emoji">' + s.emoji + '</span><span class="name">' + s.name + '</span></div>'
  ).join('');
  $('styles-grid').querySelectorAll('[data-style]').forEach(el => {
    el.addEventListener('click', () => {
      state.selectedStyle = STYLES.find(s => s.id === el.dataset.style);
      $('styles-grid').querySelectorAll('.style-card').forEach(c => c.classList.remove('selected'));
      el.classList.add('selected');
    });
  });

  document.querySelectorAll('[data-toggle]').forEach(h => {
    h.addEventListener('click', () => $(h.dataset.toggle).classList.toggle('open'));
  });

  $('agent-toggle').addEventListener('click', () => {
    state.agentEnabled = !state.agentEnabled;
    $('agent-switch').classList.toggle('on', state.agentEnabled);
    debugLog('Agent: ' + (state.agentEnabled ? 'activé' : 'désactivé'), 'info');
  });

  $('main-prompt').addEventListener('input', updateGenerateBtn);
  $('gen-type').addEventListener('change', e => { state.genType = e.target.value; });
  $('scene-count').addEventListener('change', e => { state.sceneCount = parseInt(e.target.value); });
  $('video-duration').addEventListener('change', e => { state.videoDuration = parseInt(e.target.value); });

  $('btn-generate').addEventListener('click', startGeneration);
  $('btn-stop').addEventListener('click', () => { state.stopRequested = true; setStatus('Arrêt…'); });

  $('debug-header').addEventListener('click', (e) => {
    if (e.target.tagName === 'BUTTON') return;
    $('debug-panel').classList.toggle('collapsed');
    $('debug-collapse').textContent = $('debug-panel').classList.contains('collapsed') ? '+' : '−';
  });
  $('debug-clear').addEventListener('click', (e) => { e.stopPropagation(); $('debug-body').innerHTML = ''; });
  $('debug-collapse').addEventListener('click', (e) => {
    e.stopPropagation();
    $('debug-panel').classList.toggle('collapsed');
    e.target.textContent = $('debug-panel').classList.contains('collapsed') ? '+' : '−';
  });

  debugLog('Girly Studio prêt ✨', 'success');
})();
</script>
